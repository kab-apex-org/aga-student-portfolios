<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>阿星｜智能電子機小寵物</title>
<link rel="preload" as="image" href="assets/jerry-idle.webp">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #f7e7c6;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex; justify-content: center; align-items: center;
    color: #5a321f;
  }
  .game {
    width: min(94vw, 520px); min-height: 94vh; padding: 18px 14px 22px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    background: linear-gradient(#fff4d6, #f5d9a9);
    border: 5px solid #6b3d24; border-radius: 28px;
    box-shadow: 0 8px 0 #3e2518, 0 14px 30px rgba(60,35,20,.2);
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  .subtitle { margin-top:4px; font-size:14px; opacity:.75; }
  .screen {
    width: 100%; flex: 1; min-height: 330px; margin: 12px 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#bfe8f4; border:4px solid #6b3d24; border-radius:22px;
    box-shadow: inset 0 0 0 4px #8ac9d9;
    overflow:hidden;
  }
  .name { font-weight:900; font-size:22px; margin-bottom:2px; }
  .mood { min-height:25px; font-size:16px; font-weight:700; }
  .pet {
    width: 270px; height: 270px; margin: 4px auto;
    background-repeat: no-repeat;
    background-size: 270px 270px;
    image-rendering: pixelated;
    border-radius: 16px;
  }
  /* The four groups below use frames directly from the supplied action-sheet image. */
  .idle { background-image: url("assets/jerry-idle.webp"); }
  .touch1 { background-image: url("assets/jerry-touch1.webp"); }
  .touch2 { background-image: url("assets/jerry-touch2.webp"); }
  .touch3 { background-image: url("assets/jerry-touch3.webp"); }
  .feed1 { background-image: url("assets/jerry-feed1.webp"); }
  .feed2 { background-image: url("assets/jerry-feed2.webp"); }
  .feed3 { background-image: url("assets/jerry-feed3.webp"); }
  .talk1 { background-image: url("assets/jerry-talk1.webp"); }
  .talk2 { background-image: url("assets/jerry-talk2.webp"); }
  .talk3 { background-image: url("assets/jerry-talk3.webp"); }
  .ball1 { background-image: url("assets/jerry-ball1.webp"); }
  .ball2 { background-image: url("assets/jerry-ball2.webp"); }
  .ball3 { background-image: url("assets/jerry-ball3.webp"); }
  .ball4 { background-image: url("assets/jerry-ball4.webp"); }

  .buttons {
    width:100%; display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  button {
    min-height:72px; border:4px solid #5a321f; border-radius:18px;
    font-size:21px; font-weight:900; color:#fff; cursor:pointer;
    box-shadow:0 5px 0 #3e2518; touch-action:manipulation;
  }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 #3e2518; }
  .b1 { background:#e85d75; } .b2 { background:#e99b2d; }
  .b3 { background:#4d8fd6; } .b4 { background:#4db36f; }
  .hint { font-size:12px; opacity:.65; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="game">
  <div>
    <h1>🐒 阿星的電子機</h1>
    <div class="subtitle">小組：Jerry</div>
  </div>

  <div class="screen">
    <div class="name">阿星</div>
    <div class="mood" id="mood">等你來陪我玩！</div>
    <div id="pet" class="pet idle" aria-label="阿星"></div>
  </div>

  <div class="buttons">
    <button class="b1" onclick="play('touch')">🖐️ 摸摸頭</button>
    <button class="b2" onclick="play('feed')">🍚 餵食</button>
    <button class="b3" onclick="play('talk')">💬 說話</button>
    <button class="b4" onclick="play('ball')">🏐 玩球</button>
  </div>
  <div class="hint">按大按鈕就可以和阿星互動！</div>
</div>

<script>
const pet = document.getElementById('pet');
const mood = document.getElementById('mood');

const actions = {
  touch: ['touch1','touch2','touch3','touch2'],
  feed:  ['feed1','feed2','feed3','feed2'],
  talk:  ['talk1','talk2','talk3','talk2'],
  ball:  ['ball1','ball2','ball3','ball4','ball3','ball2']
};

window.addEventListener('load', () => {
  const preload = () => [...new Set(Object.values(actions).flat())].forEach(frame => {
    const image = new Image();
    image.src = `assets/jerry-${frame}.webp`;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});

const texts = {
  touch: '好開心！摸摸我～ ❤️',
  feed: '嗯嗯！好好吃！',
  talk: 'Jerry～我聽到你了！',
  ball: '來追球球！'
};

let timer = null;

function play(type) {
  clearInterval(timer);
  let i = 0;
  const frames = actions[type];
  mood.textContent = texts[type];
  pet.className = 'pet ' + frames[0];

  timer = setInterval(() => {
    i++;
    if (i >= frames.length) {
      clearInterval(timer);
      pet.className = 'pet idle';
      mood.textContent = '再陪我玩一次吧！';
      return;
    }
    pet.className = 'pet ' + frames[i];
  }, type === 'ball' ? 260 : 330);
}
</script>
</body>
</html>
