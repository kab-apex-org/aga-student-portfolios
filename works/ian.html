const pet=document.getElementById('pet'),bubble=document.getElementById('bubble'),dead=document.getElementById('dead'),deathReason=document.getElementById('deathReason');
const hungerBar=document.getElementById('hungerBar'),hungerText=document.getElementById('hungerText'),lifeBar=document.getElementById('lifeBar'),lifeText=document.getElementById('lifeText'),activity=document.getElementById('activity'),hint=document.getElementById('hint');
let alive=true, hunger=100, life=100, lastInteraction=Date.now(), lastPlay=Date.now(), hungerDeadline=null, hungerTimer=null, lifeTimer=null, inactivityTimer=null, bubbleTimer=null;
function setPet(kind){pet.src=A[kind];pet.classList.remove('bump');void pet.offsetWidth;pet.classList.add('bump');setTimeout(()=>pet.classList.remove('bump'),130)}
function say(text,ms=1800){bubble.textContent=text;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),ms)}
function resetInteraction(){lastInteraction=Date.now();activity.textContent='有人陪我！';activity.classList.remove('danger')}
function update(){const lifePct=Math.max(0,life);hungerBar.style.width=hunger+'%';hungerText.textContent=hunger+'%';lifeBar.style.width=lifePct+'%';lifeText.textContent=lifePct+'%';}
function die(reason){if(!alive)return;alive=false;clearInterval(hungerTimer);clearInterval(lifeTimer);clearInterval(inactivityTimer);dead.classList.add('show');deathReason.textContent=reason;pet.style.opacity=.2;say('嗚嗚……我不在了……',999999)}
function start(){alive=true;hunger=100;life=100;lastInteraction=Date.now();lastPlay=Date.now();hungerDeadline=null;dead.classList.remove('show');pet.style.opacity=1;setPet('main');bubble.classList.remove('show');update();clearInterval(hungerTimer);clearInterval(lifeTimer);clearInterval(inactivityTimer);hungerTimer=setInterval(()=>{if(!alive)return;hunger=Math.max(0,hunger-20);update();if(hunger===0&&!hungerDeadline){say('我超餓！！！快點餵我！🍖',5200);hungerDeadline=Date.now()+5000;hint.textContent='🚨 飽食度已經 0%！5 秒內按「吃飯」，不然 Moly 會死掉！';}else if(hunger>0){say('肚子有點餓了～',1400);hint.textContent='🍖 飽食度 '+hunger+'%。到 0% 後，你有 5 秒可以按「吃飯」！';}},7000);lifeTimer=setInterval(()=>{if(!alive)return;const sincePlay=(Date.now()-lastPlay)/1000;if(sincePlay>=7){life=Math.max(0,life-20);update();say('你都不陪我玩……嗚嗚 😭',1800);hint.textContent='❤️ 你太久沒陪 Moly 玩了！生命每 7 秒下降 20%。快按「玩耍」！';if(life===0){die('Moly 太久沒有被陪玩，生命值降到 0% 了……');}}},7000);inactivityTimer=setInterval(()=>{if(!alive)return;const idle=(Date.now()-lastInteraction)/1000;if(idle>=20){die('你 20 秒沒有和 Moly 互動，他等不到你了……');return}if(hungerDeadline&&Date.now()>hungerDeadline&&hunger===0){die('Moly 的飽食度到了 0%，你沒有在 5 秒內按「吃飯」……');}},100);setTimeout(()=>{if(alive)hint.textContent='⚽ 每 7 秒沒有陪 Moly 玩，生命值下降 20%。🍖 飽食度也每 7 秒下降 20%；降到 0% 後 5 秒內要吃飯！'},3000)}
document.querySelectorAll('.action').forEach(btn=>btn.addEventListener('click',()=>{if(!alive)return;const a=btn.dataset.action;resetInteraction();if(a==='eat'){hunger=100;hungerDeadline=null;say('好吃！再來一碗！🍖',1800);setPet('eat');hint.textContent='🍖 飽飽的！但別忘了還要陪 Moly 玩！'}else if(a==='play'){lastPlay=Date.now();say('汪汪！球球！快追我！⚽',1700);setPet('run');life=Math.min(100,life+3);hint.textContent='⚽ 好開心！陪玩成功，接下來 7 秒不會因為沒玩而扣生命！'}else if(a==='noisy'){say('汪汪汪汪汪！！！📣',1800);setPet('noisy')}else{say('Zzz……陪我一起休息～',1800);setPet('sleep')}update()}));
document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
