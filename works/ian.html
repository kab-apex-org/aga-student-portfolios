<style>

play:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.action{min-height:100px;border:4px solid #5e351e;border-radius:13px;background:#ffd76f;box-shadow:0 5px 0 #a96b31;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px;cursor:pointer;touch-action:manipulation;position:relative}.action:active{transform:translateY(4px);box-shadow:0 1px 0 #a96b31}.action img{width:96px;height:78px;object-fit:contain;object-position:center;image-rendering:pixelated;border:2px solid #9b6130;background:#bce6f0}.action span{font-size:17px;font-weight:900}.footer{font-size:11px;text-align:center;margin-top:10px;line-height:1.5}.dead{position:absolute;inset:0;background:rgba(38,22,18,.92);display:none;align-items:center;justify-content:center;flex-direction:column;color:#ffe8b4;text-align:center;z-index:10;padding:25px}.dead.show{display:flex}.dead h2{font-size:36px;margin:0 0 8px;color:#ff8c7d}.dead p{font-size:15px;line-height:1.6}.restart{border:4px solid #4e2c1c;background:#ffd65c;padding:12px 24px;border-radius:12px;font-size:20px;font-weight:900;box-shadow:0 4px 0 #a46a2e;cursor:pointer}.hint{font-size:12px;margin-top:5px;color:#704329}.count{font-size:13px;font-weight:900}.danger{animation:blink .45s steps(2) infinite}@keyframes blink{50%{opacity:.45}}@media(max-width:390px){.screen{min-height:280px}.pet{width:83%}.action{min-height:92px}.action img{width:82px;height:68px}.action span{font-size:14px}.title h1{font-size:25px}}
</style></head><body><main class="game"><div class="title"><h1>🐾 MOLY</h1><div class="owner">主人：IAN<br><span class="count" id="activity">活力滿滿！</span></div></div>
<div class="screen"><img id="pet" class="pet" src="assets/ian-855bf5fd4e83.webp"><div id="bubble" class="bubble"></div><div id="dead" class="dead"><h2>💀 MOLY 掛掉了…</h2><p id="deathReason"></p><button class="restart" id="restart">重新開始</button></div></div>
<div class="status"><div class="meter hunger"><div class="row"><span>🍖 飽食度</span><span id="hungerText">100%</span></div><div class="bar"><div id="hungerBar" class="fill"></div></div></div><div class="meter life"><div class="row"><span>❤️ 生命</span><span id="lifeText">100%</span></div><div class="bar"><div id="lifeBar" class="fill"></div></div></div></div>
<div class="hint" id="hint">每 7 秒會餓一次；喊餓後 5 秒內要按「吃飯」。20 秒沒有互動也會死掉！</div>
<div class="buttons"><button class="action" data-action="eat"><img src="assets/ian-2edb4e4332e3.webp"><span>🍖 吃飯</span></button><button class="action" data-action="play"><img src="assets/ian-f9cc90529a75.webp"><span>⚽ 玩耍</span></button><button class="action" data-action="noisy"><img src="assets/ian-3e54ac9d8a56.webp"><span>📣 聽他吵</span></button><button class="action" data-action="sleep"><img src="assets/ian-891b77f51d47.webp"><span>💤 睡覺</span></button></div>
<div class="footer">Moly：愛吃・活潑・超級吵　｜　Ian 要記得陪我玩！</div></main>
<script>
const A={main:'assets/ian-855bf5fd4e83.webp',eat:'assets/ian-6abcfbc949dd.webp',run:'assets/ian-507ba4e40bbc.webp',noisy:'assets/ian-3539f91016ed.webp',sleep:'assets/ian-ff2b27821856.webp'};
const pet=document.getElementById('pet'),bubble=document.getElementById('bubble'),dead=document.getElementById('dead'),deathReason=document.getElementById('deathReason');
const hungerBar=document.getElementById('hungerBar'),hungerText=document.getElementById('hungerText'),lifeBar=document.getElementById('lifeBar'),lifeText=document.getElementById('lifeText'),activity=document.getElementById('activity'),hint=document.getElementById('hint');
let alive=true, hunger=100, life=100, lastInteraction=Date.now(), lastPlay=Date.now(), hungerDeadline=null, hungerTimer=null, lifeTimer=null, inactivityTimer=null, bubbleTimer=null;
function setPet(kind){pet.src=A[kind];pet.classList.remove('bump');void pet.offsetWidth;pet.classList.add('bump');setTimeout(()=>pet.classList.remove('bump'),130)}
function say(text,ms=1800){bubble.textContent=text;bubble.classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),ms)}
function resetInteraction(){lastInteraction=Date.now();activity.textContent='有人陪我！';activity.classList.remove('danger')}
function update(){const lifePct=Math.max(0,life);hungerBar.style.width=hunger+'%';hungerText.textContent=hunger+'%';lifeBar.style.width=lifePct+'%';lifeText.textContent=lifePct+'%';}
function die(reason){if(!alive)return;alive=false;clearInterval(hungerTimer);clearInterval(lifeTimer);clearInterval(inactivityTimer);dead.classList.add('show');deathReason.textContent=reason;pet.style.opacity=.2;say('嗚嗚……我不在了……',999999)}
function start(){alive=true;hunger=100;life=100;lastInteraction=Date.now();lastPlay=Date.now();hungerDeadline=null;dead.classList.remove('show');pet.style.opacity=1;setPet('main');bubble.classList.remove('show');update();clearInterval(hungerTimer);clearInterval(lifeTimer);clearInterval(inactivityTimer);hungerTimer=setInterval(()=>{if(!alive)return;hunger=Math.max(0,hunger-20);update();if(hunger===0&&!hungerDeadline){say('我超餓！！！快點餵我！🍖',5200);hungerDeadline=Date.now()+5000;hint.textContent='🚨 飽食度已經 0%！5 秒內按「吃飯」，不然 Moly 會死掉！';}else if(hunger>0){say('肚子有點餓了～',1400);hint.textContent='🍖 飽食度 '+hunger+'%。到 0% 後，你有 5 秒可以按「吃飯」！';}},7000);lifeTimer=setInterval(()=>{if(!alive)return;const sincePlay=(Date.now()-lastPlay)/1000;if(sincePlay>=7){life=Math.max(0,life-20);update();say('你都不陪我玩……嗚嗚 😭',1800);hint.textContent='❤️ 你太久沒陪 Moly 玩了！生命每 7 秒下降 20%。快按「玩耍」！';if(life===0){die('Moly 太久沒有被陪玩，生命值降到 0% 了……');}}},7000);inactivityTimer=setInterval(()=>{if(!alive)return;const idle=(Date.now()-lastInteraction)/1000;if(idle>=20){die('你 20 秒沒有和 Moly 互動，他等不到你了……');return}if(hungerDeadline&&Date.now()>hungerDeadline&&hunger===0){die('Moly 的飽食度到了 0%，你沒有在 5 秒內按「吃飯」……');}},100);setTimeout(()=>{if(alive)hint.textContent='⚽ 每 7 秒沒有陪 Moly 玩，生命值下降 20%。🍖 飽食度也每 7 秒下降 20%；降到 0% 後 5 秒內要吃飯！'},3000)}
document.querySelectorAll('.action').forEach(btn=>btn.addEventListener('click',()=>{if(!alive)return;const a=btn.dataset.action;resetInteraction();if(a==='eat'){hunger=100;hungerDeadline=null;say('好吃！再來一碗！🍖',1800);setPet('eat');hint.textContent='🍖 飽飽的！但別忘了還要陪 Moly 玩！'}else if(a==='play'){lastPlay=Date.now();say('汪汪！球球！快追我！⚽',1700);setPet('run');life=Math.min(100,life+3);hint.textContent='⚽ 好開心！陪玩成功，接下來 7 秒不會因為沒玩而扣生命！'}else if(a==='noisy'){say('汪汪汪汪汪！！！📣',1800);setPet('noisy')}else{say('Zzz……陪我一起休息～',1800);setPet('sleep')}update()}));
document.getElementById('restart').addEventListener('click',start);start();
</script><script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/ian-855bf5fd4e83.webp", "assets/ian-2edb4e4332e3.webp", "assets/ian-f9cc90529a75.webp", "assets/ian-3e54ac9d8a56.webp", "assets/ian-891b77f51d47.webp", "assets/ian-6abcfbc949dd.webp", "assets/ian-507ba4e40bbc.webp", "assets/ian-3539f91016ed.webp", "assets/ian-ff2b27821856.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
