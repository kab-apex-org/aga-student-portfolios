<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff8e8" />
<title>小狐 Marco｜智慧電子雞</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--ink:#573719;--card:#fffdf7;--line:#e7d8bc;--shadow:0 12px 30px rgba(91,57,20,.14)}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(#fffaf0,#fff2d2);color:var(--ink)}
  body{display:flex;justify-content:center;min-height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
  .app{width:min(560px,100%);min-height:100dvh;display:flex;flex-direction:column;padding:18px 0 22px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 14px}
  .name{font-weight:900;font-size:clamp(25px,6vw,34px);letter-spacing:.5px}
  .tag{font-weight:800;font-size:14px;padding:8px 11px;border-radius:999px;background:#fff;border:1px solid #eadbbf;box-shadow:0 4px 12px rgba(91,57,20,.08)}
  .stage{position:relative;flex:1;min-height:420px;background:radial-gradient(circle at 50% 72%,rgba(255,213,109,.25),transparent 37%),var(--card);border:1.5px solid var(--line);border-radius:30px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:28px 16px 18px}
  .spark{position:absolute;font-size:22px;opacity:0;pointer-events:none;animation:spark .7s ease-out}
  @keyframes spark{0%{opacity:0;transform:translateY(8px) scale(.5)}35%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.15)}}
  .pet-float{width:100%;display:flex;justify-content:center;align-items:center;animation:idle-bob 2.4s ease-in-out infinite}
  @keyframes idle-bob{0%,100%{transform:translateY(3px) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
  @media (prefers-reduced-motion:reduce){.pet-float{animation:none}}
  #pet{display:block;max-width:92%;max-height:340px;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(95,56,20,.14));transition:opacity .12s ease, transform .18s ease;user-select:none;-webkit-user-drag:none}
  #pet.pop{transform:scale(1.045)}
  .hint{position:absolute;top:18px;left:18px;right:18px;text-align:center;font-size:14px;font-weight:800;color:#8c6b45;min-height:20px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 2px 0}
  button{appearance:none;border:0;background:transparent;padding:0;min-height:68px;border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .08s ease,filter .15s ease}
  button:active{transform:scale(.965)} button:focus-visible{outline:4px solid rgba(80,130,255,.3);outline-offset:3px}
  button img{width:100%;max-width:245px;max-height:78px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 5px 7px rgba(73,45,19,.15))}
  .footer{text-align:center;color:#9a7e5a;font-weight:700;font-size:12px;padding-top:12px}
  @media (max-width:420px){.stage{min-height:390px;border-radius:25px}#pet{max-height:300px}.controls{gap:8px}button{min-height:64px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="name">小狐 Marco</div><div class="tag">🐾 智慧小寵物</div></header>
  <section class="stage" id="stage">
    <div class="hint" id="hint">Marco 在等你陪牠玩 ✨</div>
    <div class="pet-float"><img id="pet" alt="小狐 Marco" src="assets/marco-00.webp" fetchpriority="high" /></div>
  </section>
  <section class="controls" aria-label="互動按鈕">
    <button id="feed" aria-label="餵食"><img src="assets/marco-01.webp" alt="餵食"></button>
    <button id="wash" aria-label="洗澡"><img src="assets/marco-02.webp" alt="洗澡"></button>
    <button id="color" aria-label="換顏色"><img src="assets/marco-03.webp" alt="換顏色"></button>
    <button id="talk" aria-label="換說話"><img src="assets/marco-04.webp" alt="換說話"></button>
  </section>
  <div class="footer">直接點按鈕和 Marco 互動｜手機也可以玩</div>
</main>
<script>
const frames = {
 idle:'assets/marco-00.webp',
 feed:['assets/marco-05.webp','assets/marco-06.webp','assets/marco-07.webp'],
 wash:['assets/marco-08.webp','assets/marco-09.webp','assets/marco-10.webp','assets/marco-11.webp'],
 colors:['assets/marco-12.webp','assets/marco-13.webp','assets/marco-14.webp','assets/marco-15.webp'],
 talks:['assets/marco-16.webp','assets/marco-17.webp','assets/marco-18.webp','assets/marco-19.webp']
};
const pet=document.getElementById('pet'),hint=document.getElementById('hint'),stage=document.getElementById('stage');
let busy=false,colorIndex=0,timer=null;
const imageLoads=new Map();
function loadFrame(src){
  if(!imageLoads.has(src))imageLoads.set(src,new Promise(resolve=>{
    const image=new Image();image.onload=resolve;image.onerror=resolve;image.src=src;
    if(image.complete)resolve();
  }));
  return imageLoads.get(src);
}
function show(src,msg){pet.style.opacity=.15;setTimeout(()=>{pet.src=src;pet.style.opacity=1;pet.classList.remove('pop');void pet.offsetWidth;pet.classList.add('pop');},90);if(msg)hint.textContent=msg;}
function sequence(list,delays,msg,endMsg){if(busy)return;busy=true;clearTimeout(timer);hint.textContent=msg;Promise.all(list.map(loadFrame)).then(()=>{let i=0;const next=()=>{show(list[i]);i++;if(i<list.length)timer=setTimeout(next,delays[i-1]||650);else timer=setTimeout(()=>{show(frames.idle,endMsg);busy=false;},900);};next();});}
function sparkle(symbol='✨'){for(let i=0;i<6;i++){const s=document.createElement('span');s.className='spark';s.textContent=symbol;s.style.left=(25+Math.random()*50)+'%';s.style.top=(28+Math.random()*45)+'%';stage.appendChild(s);setTimeout(()=>s.remove(),750);}}
document.getElementById('feed').addEventListener('click',()=>{sparkle('❤');sequence(frames.feed,[700,700,700],'Marco 開飯囉！','吃飽飽，好開心！');});
document.getElementById('wash').addEventListener('click',()=>{sparkle('🫧');sequence(frames.wash,[550,850,650,650],'洗香香中…','洗乾淨了，閃亮亮！');});
document.getElementById('color').addEventListener('click',()=>{if(busy)return;colorIndex=(colorIndex+1)%frames.colors.length;const names=['橘色','藍色','粉紅色','灰色'];show(frames.colors[colorIndex],`Marco 變成${names[colorIndex]}了！`);sparkle('✨');clearTimeout(timer);timer=setTimeout(()=>{hint.textContent='再按一次可以繼續換顏色';},1300);});
document.getElementById('talk').addEventListener('click',()=>{if(busy)return;const i=Math.floor(Math.random()*frames.talks.length);const sayings=['汪！','我好餓～ ❤','一起玩吧！ 🐾','謝謝你！ ❤'];show(frames.talks[i],sayings[i]);sparkle('💬');clearTimeout(timer);timer=setTimeout(()=>{show(frames.idle,'Marco 在等你陪牠玩 ✨');},2200);});
window.addEventListener('load',()=>{
  const preload=()=>[...frames.feed,...frames.wash,...frames.colors,...frames.talks].forEach(loadFrame);
  if('requestIdleCallback' in window)requestIdleCallback(preload,{timeout:1500});
  else setTimeout(preload,500);
});
</script>
</body></html>
