<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小甲的電子雞</title>
<style>
:root{--ink:#382719;--wood:#75431f;--wood2:#a96b32;--cream:#fff0d2;--gold:#f4c65e;--blue:#3477b8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:#e9d4a8;background-image:radial-gradient(#b48a52 1px,transparent 1px);background-size:9px 9px;color:var(--ink);font-family:"Courier New",monospace;display:flex;justify-content:center;align-items:center;padding:20px}
.shell{width:min(850px,100%);background:#f8e8c6;border:8px solid var(--wood);outline:4px solid #3a291c;box-shadow:10px 12px 0 #9a6c38;padding:clamp(12px,3vw,28px);position:relative}
h1{margin:0 auto 8px;text-align:center;font-size:clamp(25px,5vw,42px);letter-spacing:4px;color:#fff0cf;text-shadow:3px 3px #382719,-2px -2px #382719,2px -2px #382719,-2px 2px #382719;background:var(--wood);border:5px solid #382719;padding:8px 14px;width:fit-content;max-width:100%}
.sub{text-align:center;font-weight:bold;margin:10px 0 16px;font-size:15px}
.screen{position:relative;min-height:350px;background:#f4dfb5;border:7px solid #382719;box-shadow:inset 0 0 0 5px #c18b4e;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:12px}
.pet{width:min(430px,90%);height:290px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 5px 0 #b78c55);transition:transform .12s}
.bubble{position:absolute;top:15px;left:16px;max-width:70%;padding:10px 13px;background:#fff8e7;border:4px solid #382719;box-shadow:4px 4px 0 #b98b50;font-family:inherit;font-size:clamp(14px,2.4vw,18px);font-weight:bold;display:none;z-index:3}
.bubble:after{content:"";position:absolute;bottom:-12px;left:22px;width:14px;height:14px;background:#fff8e7;border-right:4px solid #382719;border-bottom:4px solid #382719;transform:rotate(45deg)}
.status{width:100%;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:13px;font-weight:bold}
.meter{height:17px;min-width:150px;flex:1;background:#d2b68a;border:3px solid #382719;position:relative}
.fill{height:100%;width:100%;background:#77a64d;transition:width .2s}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
button{font:inherit;font-weight:bold;color:#fff2d6;background:#75431f;border:5px solid #382719;box-shadow:0 6px 0 #382719;padding:7px 5px 10px;cursor:pointer;min-width:0;transition:transform .08s,box-shadow .08s}
button:hover{background:#945a2b;transform:translateY(-2px);box-shadow:0 8px 0 #382719}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #382719}
button img{display:block;width:100%;height:100px;object-fit:cover;image-rendering:pixelated;border:3px solid #e5bd78;background:#f6e4c1;margin-bottom:7px}
button span{display:block;font-size:clamp(13px,2.2vw,18px)}
.hint{text-align:center;font-size:13px;line-height:1.6;margin:17px 0 0}
.crack{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;opacity:0;transition:opacity .1s}
.screen.broken .crack{opacity:1}
.screen.broken .pet{animation:shake .12s 5}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,2px) rotate(-1deg)}50%{transform:translate(5px,-2px) rotate(1deg)}75%{transform:translate(-3px,-1px)}100%{transform:translate(0,0)}}
@media(max-width:560px){body{padding:9px}.shell{border-width:5px;outline-width:2px;padding:10px}.screen{min-height:290px}.pet{height:230px}.controls{gap:6px}.controls button{border-width:3px;box-shadow:0 4px 0 #382719}.controls button img{height:75px}.status{font-size:13px}}
</style>
</head>
<body>
<main class="shell">
  <h1>🪲 小甲的電子雞 🪲</h1>
  <div class="sub">主人：William　｜　懶惰鍬形蟲・小甲</div>
  <section class="screen" id="screen" aria-label="小甲活動畫面">
    <div class="bubble" id="bubble" role="status"></div>
    <img class="pet" id="pet" alt="小甲目前的動作">
    <svg class="crack" viewBox="0 0 800 420" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="square">
        <path d="M400 0 374 65 405 91 360 140 392 169 344 224 371 260 330 316"/>
        <path d="M374 65 314 48 292 15M405 91 466 62 491 20M360 140 298 151 268 121M392 169 454 185 480 150M344 224 285 246 260 220M371 260 430 292 451 342"/>
        <path d="M0 190 76 207 112 170 155 195M800 110 733 138 699 103 658 130M120 420 151 363 199 376M800 340 740 316 711 352"/>
      </g>
      <g fill="none" stroke="#392719" stroke-width="2" opacity=".85">
        <path d="M400 0 374 65 405 91 360 140 392 169 344 224 371 260 330 316"/>
        <path d="M374 65 314 48 292 15M405 91 466 62 491 20M360 140 298 151 268 121M392 169 454 185 480 150M344 224 285 246 260 220M371 260 430 292 451 342"/>
      </g>
      <rect x="0" y="0" width="800" height="420" fill="#fff" opacity=".08"/>
    </svg>
  </section>
  <div class="status">
    <span id="mood">心情：懶洋洋</span>
    <span id="timerText">距離肚子餓：20 秒</span>
    <div class="meter" aria-label="飽足度"><div class="fill" id="fill"></div></div>
  </div>
  <div class="controls">
    <button id="attack"><img alt="" src="assets/william-f40897e14b1d.jpg"><span>⚔️ 攻擊</span></button>
    <button id="feed"><img alt="" src="assets/william-85f6ab57f064.jpg"><span>🍖 餵食</span></button>
    <button id="play"><img alt="" src="assets/william-b12ba1424d9e.jpg"><span>🌿 玩耍</span></button>
    <button id="sleep"><img alt="" src="assets/william-c6f4266221ea.jpg"><span>💤 睡覺</span></button>
  </div>
  <p class="hint">每 40 秒沒餵食，小甲就會喊肚子餓！<br>攻擊會出現鏡頭碎裂特效；餵食後飽足計時重新開始。</p>
</main>
<script>
const sprites = ['assets/william-f40897e14b1d.jpg','assets/william-85f6ab57f064.jpg','assets/william-b12ba1424d9e.jpg','assets/william-c6f4266221ea.jpg'];
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const screen = document.getElementById('screen');
const mood = document.getElementById('mood');
const timerText = document.getElementById('timerText');
const fill = document.getElementById('fill');
let seconds = 0, actionTimer = null, brokenTimer = null, hungry = false;
function say(text){bubble.textContent=text;bubble.style.display='block'}
function hush(){bubble.style.display='none'}
function setPet(index){pet.src=sprites[index]}
function returnIdle(delay=2600){
  clearTimeout(actionTimer);
  actionTimer=setTimeout(()=>{screen.classList.remove('broken');setPet(2);mood.textContent=hungry?'心情：餓扁了':'心情：懶洋洋';if(!hungry)hush()},delay);
}
function attack(){
  clearTimeout(actionTimer);clearTimeout(brokenTimer);
  hungry=false;screen.classList.add('broken');setPet(1);mood.textContent='心情：超有精神！';say('小甲使出頭角攻擊！鏡頭碎裂！');
  returnIdle(1800);
}
function feed(){
  clearTimeout(actionTimer);clearTimeout(brokenTimer);
  seconds=0;hungry=false;screen.classList.remove('broken');setPet(3);mood.textContent='心情：大快朵頤！';say('咕嚕咕嚕……小甲吃得好滿足！');
  updateStatus();returnIdle(3200);
}
function play(){
  clearTimeout(actionTimer);screen.classList.remove('broken');setPet(1);mood.textContent='心情：被迫活動中';say('嗯？要動一動嗎……好啦！');
  returnIdle(2400);
}
function sleep(){
  clearTimeout(actionTimer);screen.classList.remove('broken');setPet(0);mood.textContent='心情：呼呼大睡';say('呼……Zzz……別吵小甲。');
  returnIdle(4000);
}
function updateStatus(){
  const remain=Math.max(0,40-(seconds%40));
  timerText.textContent=hungry?'小甲已經餓了！':'距離肚子餓：'+remain+' 秒';
  fill.style.width=(Math.max(0,100-seconds*2.5))+'%';
  fill.style.background=hungry?'#d65a45':seconds>=12?'#e6a33d':'#77a64d';
}
document.getElementById('attack').addEventListener('click',attack);
document.getElementById('feed').addEventListener('click',feed);
document.getElementById('play').addEventListener('click',play);
document.getElementById('sleep').addEventListener('click',sleep);
setPet(2);updateStatus();
setInterval(()=>{
  seconds++;
  if(seconds>0 && seconds%40===0){
    hungry=true;mood.textContent='心情：肚子好餓';say('我肚子好餓！按下「餵食」嘛！');
  }
  updateStatus();
},1000);
</script>
<script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/william-f40897e14b1d.jpg", "assets/william-85f6ab57f064.jpg", "assets/william-b12ba1424d9e.jpg", "assets/william-c6f4266221ea.jpg"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
