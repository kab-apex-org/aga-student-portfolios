<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5d79a">
<title>阿尾｜Rocco 的智能電子雞</title>
<style>
  :root {
    --brown:#6b3f25;
    --cream:#fff4d7;
    --paper:#fffaf0;
    --gold:#f0b73e;
    --pink:#e96b70;
    --orange:#e59a2e;
    --blue:#4aa5df;
    --green:#6ebd67;
    --shadow:0 8px 0 rgba(83,47,25,.16);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; background:
      radial-gradient(circle at 20% 10%, #fff8cf 0 7%, transparent 8%),
      linear-gradient(#89d6f3 0 25%, #d9f1bb 25% 100%);
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    color:var(--brown); display:flex; justify-content:center;
  }
  .game { width:min(100%, 620px); min-height:100vh; padding:14px 12px 24px; }
  .title {
    background:#fff5d8; border:5px solid var(--brown); border-radius:20px;
    box-shadow:var(--shadow); padding:10px 14px; text-align:center;
    font-weight:900; letter-spacing:1px;
  }
  .title .big { font-size:clamp(26px,7vw,42px); }
  .title .small { font-size:14px; opacity:.8; }
  .screen {
    margin-top:14px; background:#f8e6bd; border:6px solid var(--brown);
    border-radius:28px; padding:12px; box-shadow:var(--shadow);
  }
  .status {
    display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
    font-size:13px; font-weight:800; margin-bottom:8px;
  }
  .meter { background:#fff8e8; border:3px solid var(--brown); border-radius:12px; padding:5px 8px; }
  .pet-stage {
    position:relative; height:min(58vh, 430px); min-height:330px;
    background:linear-gradient(#8bd7f2 0 52%, #9ad878 52% 100%);
    border:5px solid var(--brown); border-radius:22px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .pet-stage:before {
    content:""; position:absolute; width:85%; height:34%;
    bottom:-10%; border-radius:50%; background:rgba(70,120,55,.16);
  }
  #pet {
    position:relative; z-index:2; width:min(88%, 400px); max-height:92%;
    object-fit:contain; image-rendering:auto; filter:drop-shadow(0 10px 5px rgba(50,35,20,.2));
    transition:transform .15s ease;
  }
  #pet.pop { transform:scale(1.05) rotate(-2deg); }
  .bubble {
    position:absolute; z-index:4; top:12px; right:10px; max-width:55%;
    background:#fff; border:4px solid var(--brown); border-radius:18px;
    padding:8px 11px; font-weight:900; font-size:16px; text-align:center;
    box-shadow:0 4px 0 rgba(83,47,25,.12);
  }
  .controls {
    margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  button {
    min-height:88px; border:5px solid var(--brown); border-radius:20px;
    box-shadow:0 7px 0 rgba(83,47,25,.18); font:900 20px/1.1 inherit;
    color:var(--brown); cursor:pointer; touch-action:manipulation;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  button:active { transform:translateY(5px); box-shadow:0 2px 0 rgba(83,47,25,.18); }
  button .icon { font-size:32px; }
  .pat { background:#ffc3c7; }
  .feed { background:#ffd98b; }
  .talk { background:#a9dcff; }
  .ball { background:#b9e7a7; }
  .hint {
    margin-top:12px; background:#fffaf0; border:3px dashed var(--brown);
    border-radius:16px; padding:9px 12px; text-align:center; font-size:13px; font-weight:700;
  }
  .footer { text-align:center; margin-top:10px; font-size:12px; font-weight:800; opacity:.75; }
  @media (max-width:390px) {
    .game { padding:9px 8px 18px; }
    .pet-stage { min-height:300px; }
    button { min-height:78px; font-size:18px; }
  }
</style>
</head>
<body>
<main class="game">
  <header class="title">
    <div class="big">🐾 阿尾的智能電子雞 ❤️</div>
    <div class="small">Rocco 的咖啡色・超吵超活潑小夥伴</div>
  </header>

  <section class="screen">
    <div class="status">
      <div class="meter">❤️ 快樂：<span id="happy">80</span></div>
      <div class="meter">🍖 飽足：<span id="food">65</span></div>
      <div class="meter">⚡ 精力：<span id="energy">85</span></div>
    </div>

    <div class="pet-stage">
      <div class="bubble" id="bubble">汪！Rocco 來了！❤️</div>
      <img id="pet" alt="阿尾">
    </div>

    <div class="controls">
      <button class="pat" id="patBtn"><span class="icon">🖐️</span>摸摸頭</button>
      <button class="feed" id="feedBtn"><span class="icon">🍖</span>餵食</button>
      <button class="talk" id="talkBtn"><span class="icon">💬</span>說話</button>
      <button class="ball" id="ballBtn"><span class="icon">🔴</span>玩球</button>
    </div>

    <div class="hint" id="hint">點下面的大按鈕和阿尾互動！</div>
  </section>

  <div class="footer">阿尾會記住你的互動 ❤️　｜　手機也可以直接點</div>
</main>

<script>
const sprites = {"idle": "assets/rocco-42547460553f.webp", "pat1": "assets/rocco-a82e718fb348.webp", "pat2": "assets/rocco-46be06fac372.webp", "pat3": "assets/rocco-fd33fd11e296.webp", "pat4": "assets/rocco-d94dd4546056.webp", "feed1": "assets/rocco-f1c0eee06874.webp", "feed2": "assets/rocco-00350e133117.webp", "feed3": "assets/rocco-8b2765b92b8e.webp", "feed4": "assets/rocco-c7a75e80d940.webp", "talk1": "assets/rocco-42547460553f.webp", "talk2": "assets/rocco-b9416decd88f.webp", "talk3": "assets/rocco-debe709bc50e.webp", "talk4": "assets/rocco-e7609188e461.webp", "talk5": "assets/rocco-30dd42329515.webp", "talk6": "assets/rocco-7358566f954a.webp", "ball1": "assets/rocco-14be514aa619.webp", "ball2": "assets/rocco-02c5c5bb1710.webp", "ball3": "assets/rocco-3b53cc951ec3.webp", "ball4": "assets/rocco-1232e08ff7d4.webp", "ball5": "assets/rocco-814295efc68d.webp", "ball6": "assets/rocco-71208b095935.webp"};

const actions = {
  pat: {
    frames:["pat1","pat2","pat3","pat4"],
    messages:["嘿嘿～最喜歡 Rocco 摸我了！❤️","舒服舒服～再摸一下！","尾巴搖搖搖！🐾","我好開心！❤️"],
    stat:"happy"
  },
  feed: {
    frames:["feed1","feed2","feed3","feed4"],
    messages:["吃飯飯！好香！🍖","啊嗚！一口吃掉！","咔滋咔滋～補充能量！","吃飽了！謝謝 Rocco ❤️"],
    stat:"food"
  },
  talk: {
    frames:["talk1","talk2","talk3","talk4","talk5","talk6"],
    messages:["汪！Rocco 來了！❤️","我在這裡！🐶","我好開心！","汪汪！你在說什麼？","一起玩吧！","汪！汪！我最喜歡你！❤️"],
    stat:"happy"
  },
  ball: {
    frames:["ball1","ball2","ball3","ball4","ball5","ball6"],
    messages:["球球！我要追！🔴","跑跑跑！汪！","快一點！我追到了！","再丟一次！再一次！","嘿嘿！抓到球了！","玩球最好玩！❤️"],
    stat:"energy"
  }
};

const pet = document.getElementById("pet");
const bubble = document.getElementById("bubble");
const hint = document.getElementById("hint");
let timer = null;
let current = 0;
let values = {happy:80, food:65, energy:85};

function setPet(name) {
  pet.src = sprites[name];
  pet.classList.remove("pop");
  void pet.offsetWidth;
  pet.classList.add("pop");
}

function updateMeters() {
  for (const k of Object.keys(values)) {
    values[k] = Math.max(0, Math.min(100, values[k]));
    document.getElementById(k).textContent = values[k];
  }
}

function play(actionName) {
  const action = actions[actionName];
  clearInterval(timer);
  current = 0;
  setPet(action.frames[0]);
  bubble.textContent = action.messages[0];
  hint.textContent = actionName === "pat" ? "阿尾正在享受摸摸頭～"
    : actionName === "feed" ? "阿尾正在吃飼料～"
    : actionName === "talk" ? "阿尾正在回應你～"
    : "阿尾正在追球球～";

  if (actionName === "pat") values.happy += 6;
  if (actionName === "feed") { values.food += 15; values.energy += 5; }
  if (actionName === "talk") values.happy += 4;
  if (actionName === "ball") { values.energy -= 8; values.happy += 8; }
  updateMeters();

  timer = setInterval(() => {
    current = (current + 1) % action.frames.length;
    setPet(action.frames[current]);
    bubble.textContent = action.messages[current];
  }, actionName === "ball" ? 420 : 720);

  // Stop after a few seconds and return to a calm frame.
  setTimeout(() => {
    clearInterval(timer);
    timer = null;
    setPet(action.frames[action.frames.length - 1]);
    bubble.textContent = "汪！還要再玩嗎？❤️";
    hint.textContent = "點按鈕繼續和阿尾互動！";
  }, actionName === "ball" ? 3000 : 3800);
}

document.getElementById("patBtn").addEventListener("click", () => play("pat"));
document.getElementById("feedBtn").addEventListener("click", () => play("feed"));
document.getElementById("talkBtn").addEventListener("click", () => play("talk"));
document.getElementById("ballBtn").addEventListener("click", () => play("ball"));

setPet("talk1");
updateMeters();
</script>

</script>
</body>
</html>
