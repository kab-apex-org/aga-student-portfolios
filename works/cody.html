<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b77c5" />
<title>大笨蛋｜智慧電子雞</title>
<style>
  :root {
    --navy:#0b2d67; --blue:#0b77c5; --cyan:#8de4ff; --paper:#fff7dc;
    --ink:#10234d; --pink:#ff6c91; --yellow:#ffd34d; --panel:rgba(255,255,255,.86);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; font-family: ui-rounded, "SF Pro Rounded", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color:var(--ink); }
  body {
    min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 12%, rgba(255,255,255,.8) 0 9px, transparent 10px),
      radial-gradient(circle at 84% 18%, rgba(255,255,255,.65) 0 6px, transparent 7px),
      radial-gradient(circle at 72% 58%, rgba(255,255,255,.52) 0 8px, transparent 9px),
      linear-gradient(#58cfff 0%, #0a91da 50%, #087bc7 100%);
    background-size: 170px 170px, 210px 210px, 260px 260px, auto;
  }
  .app { width:min(760px,100%); min-height:100dvh; margin:0 auto; display:flex; flex-direction:column; padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom)); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .namecard,.timer { border:4px solid var(--navy); background:var(--paper); box-shadow:0 5px 0 rgba(4,38,88,.25); border-radius:18px; }
  .namecard { padding:9px 14px; min-width:0; }
  .petname { font-weight:1000; font-size:clamp(20px,5vw,30px); line-height:1; }
  .owner { font-size:12px; font-weight:800; margin-top:5px; opacity:.72; }
  .timer { padding:8px 12px; text-align:center; min-width:102px; }
  .timer strong { display:block; font-size:clamp(22px,6vw,34px); line-height:1; }
  .timer span { font-size:11px; font-weight:900; }

  .stage {
    position:relative; flex:1; min-height:370px; display:flex; align-items:center; justify-content:center;
    margin:8px 0 12px; border-radius:28px; border:4px solid rgba(8,52,112,.85);
    background:linear-gradient(rgba(255,255,255,.23),rgba(255,255,255,.08));
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.22), 0 10px 0 rgba(4,38,88,.18);
    overflow:hidden;
  }
  .stage::before,.stage::after { content:""; position:absolute; border:3px solid rgba(255,255,255,.55); border-radius:50%; }
  .stage::before { width:18px;height:18px;left:8%;top:19%; box-shadow:38px 38px 0 -4px rgba(255,255,255,.5), 520px 100px 0 5px rgba(255,255,255,.3); }
  .stage::after { width:10px;height:10px;right:9%;bottom:24%; box-shadow:-22px -30px 0 3px rgba(255,255,255,.35); }
  .pet-wrap { position:relative; width:min(90%,560px); height:330px; display:flex; align-items:center; justify-content:center; z-index:2; }
  #pet { max-width:100%; max-height:100%; object-fit:contain; image-rendering:auto; filter:drop-shadow(0 12px 5px rgba(0,36,79,.18)); user-select:none; -webkit-user-drag:none; transition:transform .12s ease; }
  #pet.pop { animation:pop .24s ease; }
  #pet.shake { animation:shake .35s linear; }
  @keyframes pop { 0%{transform:scale(.94)} 70%{transform:scale(1.04)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(5px)} }

  .status-panel {
    width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;
    padding:10px 12px; margin:0 0 10px; border:4px solid var(--navy); border-radius:18px;
    background:rgba(255,247,220,.95); box-shadow:0 6px 0 rgba(4,38,88,.2);
    backdrop-filter:blur(4px);
  }
  .status-title { display:none; }
  .stat { display:grid; gap:5px; min-width:0; }
  .stat-head { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:12px; font-weight:1000; }
  .stat-label { display:flex; align-items:center; gap:4px; white-space:nowrap; min-width:0; }
  .stat-value { min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  .meter { height:16px; overflow:hidden; border:3px solid var(--navy); border-radius:999px; background:#dce8ef; box-shadow:inset 0 2px 0 rgba(0,0,0,.08); }
  .meter-fill { height:100%; width:100%; border-radius:999px; transition:width .25s ease; }
  .meter-fill.food { background:linear-gradient(90deg,#ffb23f,#ff6c91); }
  .meter-fill.energy { background:linear-gradient(90deg,#ffd34d,#57c95f); }
  .meter-fill.sleep { background:linear-gradient(90deg,#8de4ff,#7b82ff); }
  .stat.low .stat-value { color:#a31335; }
  .stat.low .meter { animation:meterWarn .6s ease infinite alternate; }
  @keyframes meterWarn { to { box-shadow:0 0 0 3px rgba(255,108,145,.24), inset 0 2px 0 rgba(0,0,0,.08); } }

  .message { position:absolute; left:14px; right:14px; bottom:12px; z-index:4; text-align:center; pointer-events:none; }
  .bubble { display:inline-block; max-width:95%; padding:8px 14px; border:3px solid var(--navy); border-radius:14px; background:rgba(255,247,220,.95); font-weight:900; box-shadow:0 4px 0 rgba(4,38,88,.18); opacity:0; transform:translateY(8px); transition:.2s; }
  .bubble.show { opacity:1; transform:none; }

  .controls { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button.action {
    min-height:92px; border:4px solid var(--navy); border-radius:20px; background:var(--paper); color:var(--navy);
    font:inherit; font-weight:1000; box-shadow:0 7px 0 #063b78; padding:8px 6px 10px; touch-action:manipulation; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:transform .08s, box-shadow .08s, filter .15s;
  }
  button.action:active { transform:translateY(5px); box-shadow:0 2px 0 #063b78; }
  button.action img { width:44px; height:38px; object-fit:contain; image-rendering:pixelated; }
  button.action span { font-size:17px; }
  button.action.feed { background:#fff4be; }
  button.action.dialog { background:#ffe8f0; }
  button.action:disabled { filter:grayscale(.4) opacity(.65); cursor:not-allowed; }

  .hint { margin:12px 4px 0; text-align:center; font-size:12px; font-weight:800; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,34,72,.45); }
  .danger { color:#8a1230!important; animation:warn .6s ease infinite alternate; }
  @keyframes warn { to{transform:scale(1.06)} }

  @media (max-width:520px) {
    .app { padding-left:10px; padding-right:10px; }
    .stage { min-height:330px; border-radius:22px; }
    .pet-wrap { height:295px; width:96%; }
    .controls { gap:7px; }
    button.action { min-height:88px; border-radius:17px; padding:7px 3px 9px; }
    button.action img { width:40px; height:34px; }
    button.action span { font-size:15px; }
    .namecard,.timer { border-width:3px; }
    .status-panel { gap:6px; padding:8px; border-width:3px; border-radius:15px; }
    .stat-head { font-size:10px; gap:3px; }
    .stat-label { gap:2px; }
    .stat-value { min-width:30px; }
    .meter { height:13px; border-width:2px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="namecard">
      <div class="petname">🦈 大笨蛋</div>
      <div class="owner">小主人：大帥哥</div>
    </div>
    <div class="timer" id="timerBox"><strong id="countdown">25</strong><span>秒後要餵食</span></div>
  </header>

    <aside class="status-panel" aria-label="寵物狀態">
      <div class="status-title">寵物狀態</div>
      <div class="stat" id="statFood">
        <div class="stat-head"><span class="stat-label">🐟 飽食度</span><span class="stat-value" id="foodValue">100%</span></div>
        <div class="meter"><div class="meter-fill food" id="foodBar"></div></div>
      </div>
      <div class="stat" id="statEnergy">
        <div class="stat-head"><span class="stat-label">⚡ 體力</span><span class="stat-value" id="energyValue">100%</span></div>
        <div class="meter"><div class="meter-fill energy" id="energyBar"></div></div>
      </div>
      <div class="stat" id="statSleep">
        <div class="stat-head"><span class="stat-label">🌙 睡眠度</span><span class="stat-value" id="sleepValue">100%</span></div>
        <div class="meter"><div class="meter-fill sleep" id="sleepBar"></div></div>
      </div>
    </aside>

  <section class="stage" id="stage" aria-live="polite">
    <div class="pet-wrap"><img id="pet" alt="大笨蛋智慧小寵物" src="assets/cody-f4e03a487fd7.webp" fetchpriority="high" decoding="async" /></div>

    <div class="message"><div class="bubble" id="bubble">肚子餓了！</div></div>
  </section>

  <nav class="controls" aria-label="寵物互動功能">
    <button class="action feed" data-action="feed" aria-label="餵食">
      <img alt="" src="assets/cody-922bb59dc87c.webp" /><span>餵食</span>
    </button>
    <button class="action" data-action="sleep" aria-label="睡覺">
      <img alt="" src="assets/cody-f7b933735e1a.webp" /><span>睡覺</span>
    </button>
    <button class="action" data-action="attack" aria-label="攻擊">
      <img alt="" src="assets/cody-18d37e02f331.webp" /><span>攻擊</span>
    </button>
    <button class="action dialog" data-action="dialog" aria-label="對話">
      <img alt="" src="assets/cody-8618e00450ad.webp" /><span>對話</span>
    </button>
  </nav>
  <div class="hint">⚠️ 15 秒沒有餵食，大笨蛋就會四分五裂。餵食可以讓牠重新組回來。</div>
</main>

<script>
(() => {
  const IMG = {"idle": "assets/cody-f4e03a487fd7.webp", "feed1": "assets/cody-f4e03a487fd7.webp", "feed2": "assets/cody-4c37b1e0fffa.webp", "feed3": "assets/cody-ce1ac5358f20.webp", "sleep1": "assets/cody-67813fae88a9.webp", "sleep2": "assets/cody-01acc6cced70.webp", "sleep3": "assets/cody-51620635bf3c.webp", "attack1": "assets/cody-46bd02814e95.webp", "attack2": "assets/cody-9faec3dc5e84.webp", "attack3": "assets/cody-b42da81560e9.webp", "dialog1": "assets/cody-9d568bea29e9.webp", "dialog2": "assets/cody-23101c2efe33.webp", "auto1": "assets/cody-c03258f3b308.webp", "auto2": "assets/cody-058d4f8bc2cd.webp", "auto3": "assets/cody-2d6b2f948b4a.webp", "icon_feed": "assets/cody-922bb59dc87c.webp", "icon_sleep": "assets/cody-f7b933735e1a.webp", "icon_attack": "assets/cody-18d37e02f331.webp", "icon_dialog": "assets/cody-8618e00450ad.webp"};
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  const countdown = document.getElementById('countdown');
  const timerBox = document.getElementById('timerBox');
  const stage = document.getElementById('stage');
  const buttons = [...document.querySelectorAll('button.action')];
  const foodBar = document.getElementById('foodBar');
  const foodValue = document.getElementById('foodValue');
  const energyBar = document.getElementById('energyBar');
  const energyValue = document.getElementById('energyValue');
  const sleepBar = document.getElementById('sleepBar');
  const sleepValue = document.getElementById('sleepValue');
  const statFood = document.getElementById('statFood');
  const statEnergy = document.getElementById('statEnergy');
  const statSleep = document.getElementById('statSleep');
  const FEED_LIMIT = 25000;
  let lastFed = Date.now();
  let lastStatTick = Date.now();
  let satiety = 100;
  let energy = 100;
  let sleepLevel = 100;
  let dead = false;
  let fainted = false;
  let animationToken = 0;
  let bubbleTimer = null;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function clamp(n) { return Math.max(0, Math.min(100, n)); }

  function renderStats() {
    const stats = [
      [satiety, foodBar, foodValue, statFood],
      [energy, energyBar, energyValue, statEnergy],
      [sleepLevel, sleepBar, sleepValue, statSleep]
    ];
    stats.forEach(([value, bar, label, box]) => {
      const v = Math.round(clamp(value));
      bar.style.width = v + '%';
      label.textContent = v + '%';
      box.classList.toggle('low', v <= 25);
    });
  }

  function setImage(key, fx='pop') {
    pet.src = IMG[key];
    pet.classList.remove('pop','shake');
    void pet.offsetWidth;
    if (fx) pet.classList.add(fx);
  }

  function say(text, ms=1300) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('show');
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  async function runFrames(frames, final='idle') {
    const token = ++animationToken;
    for (const [key, ms, fx] of frames) {
      if (token !== animationToken) return;
      setImage(key, fx || 'pop');
      await sleep(ms);
    }
    if (token === animationToken && final) setImage(final, 'pop');
  }

  function reviveAndFeed() {
    dead = false;
    fainted = false;
    lastFed = Date.now();
    satiety = 100;
    energy = clamp(energy + 12);
    renderStats();
    timerBox.classList.remove('danger');
    say('啊嗚！吃掉一隻鯊魚！', 1500);
    runFrames([
      ['feed1', 300, 'pop'],
      ['feed2', 650, 'pop'],
      ['feed3', 900, 'pop']
    ]);
  }

  function doSleep() {
    if (dead) return needFood();
    energy = clamp(energy + 35);
    sleepLevel = 100;
    fainted = false;
    renderStats();
    say('Zzz… 體力和睡眠度恢復了！', 1600);
    runFrames([
      ['sleep1', 450, 'pop'],
      ['sleep2', 700, 'pop'],
      ['sleep3', 1400, 'pop']
    ]);
  }

  function doAttack() {
    if (dead) return needFood();
    if (fainted) return needRest();
    energy = clamp(energy - 22);
    sleepLevel = clamp(sleepLevel - 6);
    renderStats();
    say('尾巴攻擊！體力 -22', 1100);
    runFrames([
      ['attack1', 380, 'shake'],
      ['attack2', 430, 'pop'],
      ['attack3', 1050, 'shake']
    ]);
  }

  function doDialog() {
    if (dead) return needFood();
    if (fainted) return needRest();
    energy = clamp(energy - 4);
    renderStats();
    say('Cody你是大帥哥。', 1800);
    runFrames([
      ['dialog1', 300, 'pop'],
      ['dialog2', 1650, 'pop']
    ]);
  }

  function needRest() {
    say('體力已經 0 了！大笨蛋昏倒了，先讓牠睡覺。', 1800);
    setImage('sleep3','shake');
  }

  function faintPet() {
    if (dead || fainted) return;
    fainted = true;
    energy = 0;
    ++animationToken;
    renderStats();
    setImage('sleep3','shake');
    say('體力歸零！大笨蛋昏倒了！', 2200);
  }

  function needFood() {
    say('我已經四分五裂了！先餵我！', 1700);
    pet.classList.remove('shake'); void pet.offsetWidth; pet.classList.add('shake');
  }

  async function autoBreakApart() {
    if (dead) return;
    dead = true;
    fainted = false;
    satiety = 0;
    renderStats();
    ++animationToken;
    say('25 秒沒吃東西……要裂開了！', 1900);
    const token = animationToken;
    setImage('auto1','shake'); await sleep(650);
    if (token !== animationToken) return;
    setImage('auto2','shake'); await sleep(650);
    if (token !== animationToken) return;
    setImage('auto3','shake');
    timerBox.classList.add('danger');
  }

  buttons.forEach(btn => btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if (action === 'feed') reviveAndFeed();
    else if (action === 'sleep') doSleep();
    else if (action === 'attack') doAttack();
    else if (action === 'dialog') doDialog();
  }));

  function tick() {
    const now = Date.now();
    const elapsedSec = Math.max(0, (now - lastStatTick) / 1000);
    lastStatTick = now;

    if (!dead) {
      if (!fainted) energy = clamp(energy - elapsedSec * 0.45);
      sleepLevel = clamp(sleepLevel - elapsedSec * 0.75);
    }

    const remaining = Math.max(0, FEED_LIMIT - (now - lastFed));
    satiety = dead ? 0 : clamp((remaining / FEED_LIMIT) * 100);
    renderStats();

    if (!dead && energy <= 0) faintPet();
    if (dead) { countdown.textContent = '0'; return; }
    if (remaining <= 0) { countdown.textContent = '0'; autoBreakApart(); return; }
    const secondsLeft = Math.ceil(remaining / 1000);
    countdown.textContent = String(secondsLeft);
    timerBox.classList.toggle('danger', secondsLeft <= 5);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { lastStatTick = Date.now(); tick(); }
  });
  setInterval(tick, 150);
  renderStats();
  tick();
})();
</script>
<script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/cody-f4e03a487fd7.webp", "assets/cody-922bb59dc87c.webp", "assets/cody-f7b933735e1a.webp", "assets/cody-18d37e02f331.webp", "assets/cody-8618e00450ad.webp", "assets/cody-4c37b1e0fffa.webp", "assets/cody-ce1ac5358f20.webp", "assets/cody-67813fae88a9.webp", "assets/cody-01acc6cced70.webp", "assets/cody-51620635bf3c.webp", "assets/cody-46bd02814e95.webp", "assets/cody-9faec3dc5e84.webp", "assets/cody-b42da81560e9.webp", "assets/cody-9d568bea29e9.webp", "assets/cody-23101c2efe33.webp", "assets/cody-c03258f3b308.webp", "assets/cody-058d4f8bc2cd.webp", "assets/cody-2d6b2f948b4a.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
