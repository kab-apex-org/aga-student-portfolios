<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7c9d9" />
<title>小章魚｜皮皮的電子小寵物</title>
<style>
  :root {
    --ink:#17265f;
    --pink:#f59abd;
    --pink2:#ffd6e6;
    --cream:#fff9e9;
    --yellow:#ffd83d;
    --sky:#a8dbff;
    --shadow: rgba(23,38,95,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100%; background:linear-gradient(180deg,#ffe9f1 0%,#fff8e4 55%,#dff4ff 100%); color:var(--ink); font-family: system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif; }
  body { min-height:100svh; display:grid; place-items:center; padding:14px; }
  .machine {
    width:min(100%, 560px);
    min-height:min(92svh, 860px);
    background:#f8a7c5;
    border:6px solid var(--ink);
    border-radius:34px;
    box-shadow:0 14px 0 #d97fa5, 0 24px 45px rgba(23,38,95,.22);
    padding:16px;
    position:relative;
  }
  .machine::before,.machine::after { content:""; position:absolute; top:24px; width:10px; height:10px; border-radius:50%; background:#fff3b6; border:3px solid var(--ink); }
  .machine::before { left:22px; } .machine::after { right:22px; }
  .header { text-align:center; margin:4px 52px 12px; }
  .title { font-size:clamp(26px,7vw,38px); font-weight:950; letter-spacing:.04em; text-shadow:0 3px 0 #fff; }
  .owner { font-size:14px; font-weight:800; opacity:.8; margin-top:2px; }
  .screen {
    background:var(--cream);
    border:5px solid var(--ink);
    border-radius:26px;
    min-height:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:18px 14px 12px;
    box-shadow: inset 0 0 0 7px #fff, inset 0 -10px 0 rgba(168,219,255,.28);
    overflow:hidden;
    position:relative;
  }
  .screen::before {
    content:"";
    position:absolute; inset:12px;
    border:2px dashed rgba(23,38,95,.12);
    border-radius:18px;
    pointer-events:none;
  }
  .pet-wrap { width:100%; flex:1; min-height:330px; display:grid; place-items:center; padding:4px; }
  #pet {
    display:block;
    max-width:100%; max-height:360px;
    width:auto; height:auto;
    object-fit:contain;
    filter: drop-shadow(0 8px 0 rgba(23,38,95,.08));
    user-select:none;
  }
  #pet.swap { animation: pop .34s ease; }
  @keyframes pop { 0%{transform:scale(.86);opacity:.45} 60%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  .status {
    min-height:42px;
    width:100%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-weight:900; font-size:16px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:8px 10px;
    box-shadow:0 4px 0 #b9dbf7;
    z-index:1;
  }
  .controls {
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px;
  }
  button {
    appearance:none; border:none; font:inherit; color:var(--ink); cursor:pointer;
    min-height:82px;
    border-radius:20px;
    border:4px solid var(--ink);
    background:#fff8f0;
    box-shadow:0 7px 0 #d97fa5;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-size:clamp(18px,5vw,24px); font-weight:950;
    touch-action:manipulation;
    transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
  }
  button:active, button.active { transform:translateY(5px); box-shadow:0 2px 0 #d97fa5; background:#fff0a8; }
  .icon { font-size:1.22em; line-height:1; }
  .tiny { text-align:center; font-size:12px; font-weight:800; opacity:.65; margin:14px 0 0; }
  @media (max-height:720px) {
    body { place-items:start center; }
    .machine { min-height:auto; }
    .screen { min-height:355px; }
    .pet-wrap { min-height:260px; }
    #pet { max-height:285px; }
    button { min-height:70px; }
  }
</style>
</head>
<body>
  <main class="machine" aria-label="小章魚電子寵物機">
    <header class="header">
      <div class="title">🐙 小章魚</div>
      <div class="owner">小主人：皮皮</div>
    </header>

    <section class="screen" aria-live="polite">
      <div class="pet-wrap">
        <img id="pet" alt="小章魚目前的動作" />
      </div>
      <div class="status" id="status">皮皮，想跟小章魚玩什麼？</div>
    </section>

    <section class="controls" aria-label="互動按鈕">
      <button type="button" data-action="pat"><span class="icon">🤍</span><span>摸摸頭</span></button>
      <button type="button" data-action="talk"><span class="icon">💬</span><span>說話</span></button>
      <button type="button" data-action="perform"><span class="icon">✨</span><span>表演</span></button>
      <button type="button" data-action="sleep"><span class="icon">🌙</span><span>睡覺</span></button>
    </section>
    <div class="tiny">點按按鈕，小章魚就會換動作 ♡</div>
  </main>

<script>
const sprites = {
  pat: 'assets/ula-6b5be238f338.webp',
  talk: 'assets/ula-6918fd6f9fad.webp',
  perform: 'assets/ula-1085ea57f3be.webp',
  sleep: 'assets/ula-1ff7bbd80713.webp'
};
const messages = {
  pat: '摸摸摸摸～小章魚超開心！',
  talk: '皮皮～我在這裡！',
  perform: '看我的！小章魚轉一圈～✨',
  sleep: '呼嚕……Z Z Z……'
};

const pet = document.getElementById('pet');
const status = document.getElementById('status');
const buttons = [...document.querySelectorAll('button[data-action]')];

function setAction(action, pressedButton) {
  pet.classList.remove('swap');
  // force restart animation
  void pet.offsetWidth;
  pet.src = sprites[action];
  pet.classList.add('swap');
  status.textContent = messages[action];
  buttons.forEach(b => b.classList.toggle('active', b === pressedButton));
  if ('vibrate' in navigator) navigator.vibrate(18);
}

buttons.forEach(btn => {
  btn.addEventListener('click', () => setAction(btn.dataset.action, btn));
});

// Start in a cheerful state using the storyboard artwork.
pet.src = sprites.pat;
</script>
<script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/ula-6b5be238f338.webp", "assets/ula-6918fd6f9fad.webp", "assets/ula-1085ea57f3be.webp", "assets/ula-1ff7bbd80713.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
