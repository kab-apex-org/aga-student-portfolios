<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>帥氣的狗狗｜電子雞</title>
<style>
  :root{
    --blue:#174ea6;
    --blue2:#2f75d6;
    --cream:#fff7df;
    --ink:#17345f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at 50% 15%, #fff8df 0 8%, transparent 30%),
      linear-gradient(160deg,#9edcff,#e9f5ff 48%,#b9e6c5);
    font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
  }
  .pet-game{
    width:min(94vw,520px);
    min-height:min(94vh,760px);
    padding:18px 16px 20px;
    border:5px solid #163b7a;
    border-radius:28px;
    background:#dff3ff;
    box-shadow:0 12px 0 #163b7a, 0 20px 45px rgba(18,50,90,.25);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .title{
    margin:0;
    font-size:clamp(22px,6vw,30px);
    font-weight:900;
    letter-spacing:1px;
  }
  .owner{
    background:var(--cream);
    border:3px solid #173f83;
    border-radius:14px;
    padding:6px 10px;
    font-weight:800;
    white-space:nowrap;
  }
  .screen{
    flex:1;
    min-height:380px;
    border:5px solid #173f83;
    border-radius:24px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.15)),
      #f7f1df;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .screen-label{
    position:absolute;
    left:12px; top:10px;
    z-index:3;
    padding:5px 9px;
    border:3px solid #173f83;
    border-radius:12px;
    background:#fff7df;
    font-size:14px;
    font-weight:900;
  }
  .pet-stage{
    flex:1;
    min-height:330px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 10px 8px;
  }
  #pet{
    width:min(88%,390px);
    max-height:330px;
    object-fit:contain;
    image-rendering:auto;
    transition:transform .18s ease, filter .18s ease;
    user-select:none;
    -webkit-user-drag:none;
  }
  .bounce{animation:bounce .45s ease}
  .flash{animation:flash .35s ease}
  @keyframes bounce{
    0%{transform:scale(.88) translateY(8px)}
    45%{transform:scale(1.08) translateY(-8px)}
    100%{transform:scale(1) translateY(0)}
  }
  @keyframes flash{
    0%{filter:brightness(1)}
    45%{filter:brightness(1.55)}
    100%{filter:brightness(1)}
  }
  .status{
    border-top:3px solid #173f83;
    background:#fff7df;
    min-height:58px;
    padding:9px 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:900;
    font-size:16px;
  }
  .buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  button{
    min-height:78px;
    border:4px solid #173f83;
    border-radius:20px;
    background:#fff7df;
    color:#173f83;
    font:inherit;
    font-size:clamp(18px,5vw,22px);
    font-weight:950;
    cursor:pointer;
    box-shadow:0 6px 0 #173f83;
    touch-action:manipulation;
    user-select:none;
  }
  button:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #173f83;
  }
  .icon{font-size:28px;display:block;margin-bottom:2px}
  .hint{
    text-align:center;
    font-size:12px;
    opacity:.75;
    margin-top:-3px;
  }
  @media (max-height:650px){
    .pet-game{min-height:96vh;padding:12px}
    .screen{min-height:300px}
    .pet-stage{min-height:250px}
    #pet{max-height:250px}
    button{min-height:65px}
  }
</style>
</head>
<body>
<main class="pet-game">
  <div class="topbar">
    <h1 class="title">🐶 帥氣的狗狗</h1>
    <div class="owner">小主人：woody</div>
  </div>

  <section class="screen" aria-live="polite">
    <div class="screen-label" id="mode">目前：待機</div>
    <div class="pet-stage">
      <img id="pet" src="assets/woody-00.webp" alt="帥氣的狗狗電子雞角色" fetchpriority="high">
    </div>
    <div class="status" id="status">汪！我在等 woody 跟我玩～</div>
  </section>

  <section class="buttons" aria-label="寵物互動">
    <button id="feed"><span class="icon">🍖</span>餵食</button>
    <button id="talk"><span class="icon">💬</span>說話</button>
    <button id="color"><span class="icon">🎨</span>換顏色</button>
    <button id="perform"><span class="icon">⭐</span>表演</button>
  </section>
  <div class="hint">手機上可直接點擊｜每次互動都會換一個動作</div>
</main>

<script>
const sprites = {"feed": ["assets/woody-00.webp", "assets/woody-01.webp", "assets/woody-02.webp", "assets/woody-03.webp"], "talk": ["assets/woody-04.webp", "assets/woody-05.webp", "assets/woody-06.webp", "assets/woody-07.webp"], "color": ["assets/woody-08.webp", "assets/woody-09.webp", "assets/woody-10.webp", "assets/woody-11.webp"], "perform": ["assets/woody-12.webp", "assets/woody-13.webp", "assets/woody-14.webp", "assets/woody-15.webp", "assets/woody-16.webp"]};

const pet = document.getElementById("pet");
const statusEl = document.getElementById("status");
const modeEl = document.getElementById("mode");

const state = {
  feed: 0,
  talk: 0,
  color: 0,
  perform: 0
};

function show(group, message, effect="bounce"){
  const list = sprites[group];
  const index = state[group] % list.length;
  pet.src = list[index];
  state[group]++;
  modeEl.textContent =
    group === "feed" ? "目前：餵食中" :
    group === "talk" ? "目前：聊天中" :
    group === "color" ? "目前：變色中" :
    "目前：表演中";
  statusEl.textContent = message;
  pet.classList.remove("bounce","flash");
  void pet.offsetWidth;
  pet.classList.add(effect);
}

document.getElementById("feed").addEventListener("click",()=>{
  const messages = [
    "好香！我要開動啦！😋",
    "嗯嗯！這個飼料超好吃！",
    "吃飽飽～謝謝 woody！❤️",
    "再一點點嘛～我還可以吃！"
  ];
  show("feed", messages[state.feed % messages.length]);
});

document.getElementById("talk").addEventListener("click",()=>{
  const messages = [
    "woody～你叫我嗎？汪！",
    "我今天心情超好！🐶",
    "woody，你真的很棒！",
    "陪我玩一下嘛～汪汪！"
  ];
  show("talk", messages[state.talk % messages.length]);
});

document.getElementById("color").addEventListener("click",()=>{
  const messages = [
    "變身完成！我是咖啡色狗狗！🤎",
    "哇！灰色的我也很帥吧！🩶",
    "粉紅色登場～✨",
    "變回原本的白色啦！🤍"
  ];
  show("color", messages[state.color % messages.length], "flash");
});

document.getElementById("perform").addEventListener("click",()=>{
  const messages = [
    "看我的新表演！站起來～✨",
    "嘿！我會揮手喔！👋",
    "咻！我來翻滾一下！",
    "跳圈圈成功！是不是很帥！🎪",
    "表演結束！再一次好不好？❤️"
  ];
  show("perform", messages[state.perform % messages.length]);
});

// 預設顯示動作表中的第一個白色待機角色
pet.src = sprites.feed[0];

window.addEventListener("load", () => {
  const preload = () => Object.values(sprites).flat().slice(1).forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ("requestIdleCallback" in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
