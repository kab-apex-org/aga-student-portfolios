<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>李昕愛｜精緻像素電子雞</title>
<style>
:root{
  --navy:#123f72;--navy2:#0c315b;--cream:#fff7e8;--paper:#fffdf6;
  --pink:#f35f8d;--pink2:#ffd5df;--gold:#e7a62d;--green:#45b96a;--purple:#8060cf;
  --ink:#17375e;--sky:#9bdcff;--floor:#f3c878;--floor2:#e8b766;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#bfe6ff,#fff2cf);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink)}
body{padding:18px;display:flex;justify-content:center;align-items:flex-start}
button{font:inherit}
.app{width:min(1180px,100%);background:var(--paper);border:5px solid var(--navy);border-radius:24px;overflow:hidden;box-shadow:0 10px 0 var(--navy2),0 24px 50px #17375e35}
.topbar{min-height:78px;padding:11px 18px;background:linear-gradient(#1d5793,#123f72);color:white;display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--navy2)}
.logoPaw{width:52px;height:52px;border:4px solid white;border-radius:16px;background:#ffedf2;display:grid;place-items:center;font-size:30px;box-shadow:3px 3px 0 #0c315b}
.titleBlock h1{font-size:28px;margin:0;letter-spacing:2px;text-shadow:2px 2px 0 #0c315b}
.titleBlock p{margin:2px 0 0;font-weight:800;opacity:.88;font-size:13px}
.owner{margin-left:auto;background:#f25d8b;border:3px solid white;padding:8px 12px;border-radius:14px;font-weight:1000;box-shadow:3px 3px 0 #0c315b}
.shell{display:grid;grid-template-columns:285px 1fr;gap:14px;padding:14px}
.panel{background:var(--cream);border:4px solid var(--navy);border-radius:18px;box-shadow:3px 3px 0 #d5b47a}
.sidebar{padding:12px;display:flex;flex-direction:column;gap:12px}
.profile{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.avatar{width:92px;height:92px;border:4px solid var(--navy);background:linear-gradient(#72c9ff,#d7f4ff);border-radius:16px;display:grid;place-items:end center;overflow:hidden;position:relative}
.avatar:after{content:"";position:absolute;inset:auto 6px 7px;height:10px;background:#ffffff88;border-radius:50%}
.avatar img{width:95px;transform:translateY(9px);image-rendering:pixelated;filter:drop-shadow(0 3px 0 #17375e22)}
.kicker{display:inline-block;background:var(--pink);color:white;border:3px solid var(--navy);border-radius:8px;padding:2px 7px;font-weight:1000;font-size:13px}
.petName{font-weight:1000;font-size:27px;line-height:1.05;margin-top:7px}
.ownerName{font-size:14px;font-weight:900;margin-top:7px}
.stats{display:grid;gap:11px;padding-top:4px}
.statRow{display:grid;gap:4px}
.statHead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:1000}
.bar{height:15px;border:3px solid var(--navy);background:#d9e1e8;border-radius:20px;overflow:hidden}
.fill{height:100%;width:80%;transition:width .35s ease}
.fill.pink{background:var(--pink)} .fill.gold{background:var(--gold)} .fill.green{background:var(--green)} .fill.purple{background:var(--purple)}
.traits{border-top:3px dashed #e2c18b;padding-top:10px;font-size:14px;font-weight:900;line-height:1.8}
.tip{margin-top:auto;background:#fff;border:3px solid var(--navy);border-radius:13px;padding:9px;font-size:12px;font-weight:900;line-height:1.45}
.main{display:flex;flex-direction:column;gap:11px;min-width:0}
.scene{position:relative;min-height:500px;overflow:hidden;border:4px solid var(--navy);border-radius:18px;background:linear-gradient(#c8efff 0 56%,#f2c77c 56% 100%);isolation:isolate}
.wall{position:absolute;inset:0 0 44%;background:linear-gradient(180deg,#fff5dd,#fff0cf);z-index:-5}
.window{position:absolute;left:8%;top:7%;width:38%;height:40%;border:9px solid #b47b43;background:linear-gradient(#7fd0ff,#d5f5ff);box-shadow:inset 0 0 0 4px #f8d9a8;z-index:-4}
.window:before,.window:after{content:"";position:absolute;background:#f2c27b}
.window:before{width:8px;height:100%;left:50%;transform:translateX(-50%)}
.window:after{height:8px;width:100%;top:52%;transform:translateY(-50%)}
.cloud{position:absolute;background:white;width:54px;height:20px;border-radius:5px;box-shadow:19px -10px 0 2px white,37px 1px 0 -2px white;opacity:.9}
.c1{left:12%;top:13%} .c2{left:34%;top:22%;transform:scale(.75)}
.floor{position:absolute;left:0;right:0;bottom:0;height:44%;z-index:-4;background:repeating-linear-gradient(0deg,#efc475 0 17px,#e6b564 17px 21px)}
.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 90px,#d9a65b 90px 94px);opacity:.4}
.plant{position:absolute;left:4%;bottom:38%;width:80px;height:122px;z-index:-1}
.pot{position:absolute;bottom:0;left:18px;width:48px;height:46px;background:#dd8751;border:5px solid #8f5a37;border-radius:4px 4px 12px 12px}
.stem{position:absolute;left:39px;bottom:40px;width:8px;height:48px;background:#4a9445}
.leaf{position:absolute;width:32px;height:27px;background:#71bf43;border:4px solid #3c8637;border-radius:7px}
.l1{left:3px;bottom:73px} .l2{left:42px;bottom:88px} .l3{left:18px;bottom:101px} .l4{left:47px;bottom:55px}
.tree{position:absolute;right:2.5%;bottom:30%;width:150px;height:235px;z-index:-1}
.trunk{position:absolute;right:55px;bottom:0;width:18px;height:156px;background:#8e6139;border:5px solid #6d472a}
.platform{position:absolute;right:3px;width:138px;height:30px;background:#d7a15c;border:5px solid #704728;border-radius:50%}
.p1{bottom:145px} .p2{bottom:73px;right:16px;width:112px}
.ball{position:absolute;right:57px;bottom:102px;width:27px;height:38px;border-radius:50%;background:#ef6f91;border:4px solid #704728;animation:sway 2.2s ease-in-out infinite;transform-origin:50% -30px}
.ball:before{content:"";position:absolute;left:10px;top:-38px;width:3px;height:38px;background:#704728}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.bed{position:absolute;right:17%;bottom:8%;width:148px;height:75px;background:#f693b1;border:6px solid #be5275;border-radius:50% 50% 35% 35%;z-index:0;box-shadow:inset 0 13px 0 #ffc0d0}
.bed:after{content:"✦";position:absolute;right:24px;top:24px;color:#fff4c5;font-size:26px}
.bowl{position:absolute;left:15%;bottom:6%;width:92px;height:55px;background:#f46e94;border:6px solid #9c3658;border-radius:14px 14px 36px 36px;z-index:2;display:grid;place-items:center;color:#fff;font-weight:1000}
.bowl:before{content:"";position:absolute;left:9px;right:9px;top:-8px;height:25px;border-radius:50%;background:repeating-linear-gradient(45deg,#7c431e 0 7px,#a65b25 7px 12px);border:4px solid #9c3658}
.fish{position:absolute;right:24%;bottom:7%;font-size:48px;filter:drop-shadow(3px 3px 0 #17375e55);z-index:1;transform:rotate(-8deg)}
.speech{position:absolute;right:4%;top:5%;max-width:250px;background:#fffdf5;border:4px solid var(--navy);border-radius:17px;padding:10px 14px;font-weight:1000;font-size:18px;line-height:1.35;box-shadow:4px 4px 0 #17375e44;z-index:8}
.speech:after{content:"";position:absolute;left:28px;bottom:-18px;border-style:solid;border-width:16px 13px 0 0;border-color:var(--navy) transparent transparent transparent}
.pet{position:absolute;left:50%;bottom:7%;width:clamp(155px,25vw,245px);z-index:5;transition:left 1.15s cubic-bezier(.2,.8,.2,1),bottom 1.15s cubic-bezier(.2,.8,.2,1),width .45s ease;transform:translateX(-50%);touch-action:manipulation}
.petInner{position:relative;transform-origin:center bottom;animation:idleBob 1.8s ease-in-out infinite}
.pet img{display:block;width:100%;height:auto;image-rendering:pixelated;filter:drop-shadow(0 7px 0 #17375e27)}
.pet.walking .petInner{animation:walkBob .25s ease-in-out infinite alternate}
.pet.eating .petInner{animation:eatBob .42s ease-in-out infinite alternate}
.pet.happy .petInner{animation:happyJump .5s ease-in-out 4}
.pet.cuddle .petInner{animation:cuddle 1s ease-in-out infinite alternate}
@keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes walkBob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-8px) rotate(1deg)}}
@keyframes eatBob{from{transform:translateY(0) rotate(0)}to{transform:translateY(8px) rotate(5deg)}}
@keyframes happyJump{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.03)}}
@keyframes cuddle{from{transform:scale(1.08) rotate(-2deg)}to{transform:scale(1.13) rotate(2deg)}}
.fx{position:absolute;z-index:9;pointer-events:none;font-size:28px;animation:floatUp 1.2s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-85px) scale(1.3)}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.action{min-height:90px;border:4px solid var(--navy);border-radius:16px;cursor:pointer;font-weight:1000;color:var(--ink);box-shadow:0 5px 0 var(--navy);transition:transform .12s,box-shadow .12s;padding:8px;background:white}
.action:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.action .ico{font-size:30px;line-height:1}
.action .mainTxt{display:block;font-size:18px;margin-top:3px}
.action .subTxt{display:block;font-size:11px;margin-top:2px;opacity:.72}
.aPink{background:#ffe7ef;border-color:#c73668} .aGold{background:#fff1c9;border-color:#b87800} .aGreen{background:#e8faeb;border-color:#268c49} .aPurple{background:#f0ebff;border-color:#6045a9}
.statusline{background:var(--navy);color:white;border-radius:13px;padding:9px 13px;font-weight:900;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.statusline small{opacity:.8;font-weight:700}
.bottom{padding:10px 15px;background:linear-gradient(#154d84,#103d6c);color:#fff;display:flex;align-items:center;justify-content:space-between;font-weight:900;border-top:4px solid #0c315b}
.reset{border:3px solid white;background:#fffdf5;color:var(--navy);border-radius:10px;padding:6px 10px;font-weight:1000;cursor:pointer}
.mobileStats{display:none}
@media(max-width:850px){
 body{padding:8px}
 .shell{grid-template-columns:1fr;padding:8px}
 .sidebar{display:none}
 .topbar{min-height:66px;padding:9px 10px}
 .logoPaw{width:45px;height:45px;font-size:25px}
 .titleBlock h1{font-size:21px;letter-spacing:1px}
 .titleBlock p{display:none}
 .owner{font-size:12px;padding:6px 8px}
 .mobileStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .mstat{background:#fff;border:3px solid var(--navy);border-radius:10px;padding:5px;text-align:center;font-size:11px;font-weight:1000}
 .mstat b{display:block;font-size:16px}
 .scene{min-height:430px}
 .actions{grid-template-columns:repeat(2,1fr)}
 .action{min-height:78px}
 .speech{font-size:15px;max-width:185px}
 .pet{width:clamp(145px,43vw,205px)}
 .bed{right:5%;width:120px;height:62px}
 .tree{transform:scale(.8);transform-origin:right bottom}
 .fish{right:18%;font-size:38px}
 .bowl{left:8%;transform:scale(.85);transform-origin:left bottom}
 .statusline{font-size:13px}
 .bottom span{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logoPaw">🐾</div>
    <div class="titleBlock"><h1>智能小寵物｜李昕愛</h1><p>精緻像素電子雞・房間互動版</p></div>
    <div class="owner">主人：亮言 ♥</div>
  </header>

  <div class="shell">
    <aside class="panel sidebar">
      <div class="profile">
        <div class="avatar"><img src="assets/johnny-5dc1f669942e.webp" alt="李昕愛"></div>
        <div><span class="kicker">寵物名</span><div class="petName">李昕愛</div><div class="ownerName">主人：亮言</div></div>
      </div>
      <div class="stats">
        <div class="statRow"><div class="statHead"><span>💗 親密</span><span id="loveVal">88</span></div><div class="bar"><div class="fill pink" id="love"></div></div></div>
        <div class="statRow"><div class="statHead"><span>🍚 飽食</span><span id="foodVal">74</span></div><div class="bar"><div class="fill gold" id="food"></div></div></div>
        <div class="statRow"><div class="statHead"><span>⚡ 活力</span><span id="energyVal">86</span></div><div class="bar"><div class="fill green" id="energy"></div></div></div>
        <div class="statRow"><div class="statHead"><span>⭐ 開心</span><span id="happyVal">90</span></div><div class="bar"><div class="fill purple" id="happy"></div></div></div>
      </div>
      <div class="traits">🐾 很愛撒嬌<br>🐾 看到食物會超開心<br>🐾 喜歡跑來跑去<br>🐾 有亮言在就很安心</div>
      <div class="tip">小提示：沒有操作時，李昕愛會自己在房間裡走動。每 25 秒狀態會稍微變化。</div>
    </aside>

    <main class="main">
      <div class="mobileStats">
        <div class="mstat">💗 親密<b id="mLove">88</b></div><div class="mstat">🍚 飽食<b id="mFood">74</b></div><div class="mstat">⚡ 活力<b id="mEnergy">86</b></div><div class="mstat">⭐ 開心<b id="mHappy">90</b></div>
      </div>

      <section class="scene" id="scene" aria-label="李昕愛的房間">
        <div class="wall"></div><div class="window"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="floor"></div>
        <div class="plant"><div class="pot"></div><div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div></div>
        <div class="tree"><div class="trunk"></div><div class="platform p1"></div><div class="platform p2"></div><div class="ball"></div></div>
        <div class="bed" title="李昕愛的窩"></div>
        <div class="bowl" id="bowl">MEAL</div>
        <div class="fish" id="fish">🐟</div>
        <div class="speech" id="speech">亮言～<br>我最愛你了！ 💗</div>
        <div class="pet" id="pet" role="button" tabindex="0" aria-label="摸摸李昕愛">
          <div class="petInner"><img src="assets/johnny-5dc1f669942e.webp" alt="李昕愛"></div>
        </div>
      </section>

      <div class="actions">
        <button class="action aPink" onclick="act('cuddle')"><span class="ico">💗</span><span class="mainTxt">撒嬌</span><span class="subTxt">跑到你面前求抱抱</span></button>
        <button class="action aGold" onclick="act('eat')"><span class="ico">🍚</span><span class="mainTxt">愛吃</span><span class="subTxt">自己走去食物碗</span></button>
        <button class="action aGreen" onclick="act('play')"><span class="ico">🐟</span><span class="mainTxt">活潑</span><span class="subTxt">追著玩具跑跑跳跳</span></button>
        <button class="action aPurple" onclick="act('happy')"><span class="ico">⭐</span><span class="mainTxt">開心</span><span class="subTxt">跳起來灑滿愛心</span></button>
      </div>
      <div class="statusline"><span id="log">🐾 李昕愛正在房間裡晃來晃去～</span><small id="clock">自動走動中</small></div>
    </main>
  </div>
  <footer class="bottom"><span>李昕愛 × 亮言｜復古像素電子雞</span><button class="reset" onclick="resetPet()">重新開始</button></footer>
</div>
<script>
const state={love:88,food:74,energy:86,happy:90};
let busy=false, roamTimer=null, actionTimer=null, decayTimer=null;
const pet=document.getElementById('pet'), scene=document.getElementById('scene'), speech=document.getElementById('speech'), log=document.getElementById('log');
const clamp=v=>Math.max(0,Math.min(100,v));
function render(){
  for(const k of Object.keys(state)){
    document.getElementById(k).style.width=state[k]+'%';
    document.getElementById(k+'Val').textContent=Math.round(state[k]);
  }
  document.getElementById('mLove').textContent=Math.round(state.love);
  document.getElementById('mFood').textContent=Math.round(state.food);
  document.getElementById('mEnergy').textContent=Math.round(state.energy);
  document.getElementById('mHappy').textContent=Math.round(state.happy);
}
function say(html,text=html.replace(/<br>/g,' ')){speech.innerHTML=html;log.textContent='🐾 '+text.replace(/<[^>]+>/g,'')}
function sparkle(count=5,emoji=['💗','💕','✨','⭐']){
  const r=scene.getBoundingClientRect(); const p=pet.getBoundingClientRect();
  for(let i=0;i<count;i++)setTimeout(()=>{
    const e=document.createElement('div');e.className='fx';e.textContent=emoji[Math.floor(Math.random()*emoji.length)];
    e.style.left=((p.left-r.left)+(p.width*(.2+Math.random()*.6)))+'px';e.style.top=((p.top-r.top)+(p.height*(.15+Math.random()*.45)))+'px';
    scene.appendChild(e);setTimeout(()=>e.remove(),1300);
  },i*120);
}
function setPos(x,bottom,width=null){pet.style.left=x+'%';pet.style.bottom=bottom+'%';if(width)pet.style.width=width}
function clearClasses(){pet.classList.remove('walking','eating','happy','cuddle')}
function scheduleRoam(delay=2600){clearTimeout(roamTimer);roamTimer=setTimeout(roam,delay)}
function roam(){
  if(busy) return scheduleRoam(1800);
  clearClasses();pet.classList.add('walking');
  const x=24+Math.random()*46; const b=6+Math.random()*5;
  setPos(x,b);say(['喵～我去那邊看看！','亮言，我在房間散步～','今天也要到處巡邏！'][Math.floor(Math.random()*3)]);
  setTimeout(()=>pet.classList.remove('walking'),1200);scheduleRoam(3600+Math.random()*2400);
}
function finish(ms=2600){clearTimeout(actionTimer);actionTimer=setTimeout(()=>{busy=false;clearClasses();say('喵～我又要去逛逛囉！');scheduleRoam(700)},ms)}
function act(type){
  busy=true;clearTimeout(roamTimer);clearTimeout(actionTimer);clearClasses();
  if(type==='cuddle'){
    state.love=clamp(state.love+12);state.happy=clamp(state.happy+7);pet.classList.add('cuddle');setPos(50,2,'min(285px,44vw)');say('亮言～<br>抱抱我嘛！ 💗');sparkle(7,['💗','💕','♥']);finish(2600);
  } else if(type==='eat'){
    state.food=clamp(state.food+22);state.happy=clamp(state.happy+5);state.energy=clamp(state.energy+3);pet.classList.add('walking');setPos(23,5);
    say('看到食物了！<br>我要去吃飯～ 🍚');setTimeout(()=>{pet.classList.remove('walking');pet.classList.add('eating');say('好吃！<br>嚼嚼嚼～ 😋')},1050);finish(3300);
  } else if(type==='play'){
    state.energy=clamp(state.energy-9);state.food=clamp(state.food-5);state.happy=clamp(state.happy+14);pet.classList.add('walking');setPos(69,7);say('魚魚！<br>抓到你了～ 🐟');
    setTimeout(()=>{pet.classList.remove('walking');pet.classList.add('happy');sparkle(4,['✨','⭐'])},1000);finish(2800);
  } else if(type==='happy'){
    state.love=clamp(state.love+6);state.happy=clamp(state.happy+10);pet.classList.add('happy');setPos(50,7);say('有你在，<br>我就好開心！ ⭐');sparkle(9);finish(2600);
  }
  render();
}
function petTap(){if(busy)return;state.love=clamp(state.love+3);state.happy=clamp(state.happy+2);render();say('喵～再摸一下！ 💕');sparkle(3,['💗','✨']);pet.classList.add('happy');setTimeout(()=>pet.classList.remove('happy'),900)}
pet.addEventListener('click',petTap);pet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')petTap()});
function decay(){if(!busy){state.food=clamp(state.food-2);state.energy=clamp(state.energy-1);state.happy=clamp(state.happy-1);render();if(state.food<25)say('肚子有點餓了……<br>想吃飯 🍚');else if(state.energy<20)say('跑累了～<br>我想休息一下 💤')}}
function resetPet(){busy=false;Object.assign(state,{love:88,food:74,energy:86,happy:90});render();clearClasses();setPos(50,7);say('亮言～<br>我最愛你了！ 💗');scheduleRoam(1600)}
render();scheduleRoam(2200);decayTimer=setInterval(decay,25000);
</script>
<script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/johnny-5dc1f669942e.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
