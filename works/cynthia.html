<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阿頭｜安安的電子雞</title>
<style>
:root {
  --bg:#17132b; --panel:#6d55b5; --panel2:#30245e; --ink:#fff7ff;
  --pink:#ff82bd; --yellow:#ffd75e; --cyan:#72dfff;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:
    radial-gradient(circle at 20% 15%, #4d3b86 0 2px, transparent 3px),
    radial-gradient(circle at 75% 35%, #8a73d0 0 1px, transparent 2px),
    radial-gradient(circle at 55% 80%, #4d3b86 0 2px, transparent 3px),
    var(--bg);
  background-size:46px 46px, 37px 37px, 61px 61px;
  font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
  color:var(--ink); padding:18px;
}
.shell {
  width:min(440px,100%); padding:14px; border-radius:34px;
  background:linear-gradient(145deg,#9c82e5,#49357e);
  box-shadow:0 20px 50px #0008, inset 0 2px 0 #ffffff55;
  border:3px solid #c7b8ff;
}
.screen {
  position:relative; overflow:hidden; min-height:560px; border-radius:25px;
  padding:18px; background:
    radial-gradient(circle at 80% 20%, #8b78d4 0 2px, transparent 3px),
    linear-gradient(#20194b,#332565);
  border:3px solid #1b143b; box-shadow:inset 0 0 0 3px #806bd0;
}
.header {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  font-weight:900; letter-spacing:2px;
}
.title { font-size:25px; }
.owner { font-size:13px; opacity:.9; }
.status {
  display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:14px;
}
.meter { background:#181338aa; border:2px solid #8d79d6; border-radius:12px; padding:7px; }
.meter b { display:block; font-size:11px; margin-bottom:4px; }
.bar { height:8px; background:#0e0a24; border-radius:8px; overflow:hidden; }
.fill { height:100%; border-radius:8px; transition:width .35s; }
#foodBar { background:#ffd75e; width:76%; }
#happyBar { background:#ff82bd; width:88%; }
#energyBar { background:#72dfff; width:70%; }

.stage {
  position:relative; height:330px; overflow:visible; display:grid; place-items:center;
  margin-top:8px;
}
.pet {
  position:relative; z-index:1;
  width:260px; max-width:78%; image-rendering:auto; user-select:none;
  filter:drop-shadow(0 12px 10px #0007);
  transition:filter .25s, transform .25s;
}
.pet.eat { animation:bounce .42s infinite alternate; }
.pet.talk { animation:talk .28s infinite alternate; }
.pet.sleep { animation:snore 1.6s infinite ease-in-out; }
.pet.color1 { filter:hue-rotate(325deg) saturate(1.2) drop-shadow(0 12px 10px #0007); }
.pet.color2 { filter:hue-rotate(195deg) saturate(1.25) drop-shadow(0 12px 10px #0007); }
.pet.color3 { filter:hue-rotate(65deg) saturate(1.1) drop-shadow(0 12px 10px #0007); }
.pet.color4 { filter:hue-rotate(255deg) saturate(1.15) drop-shadow(0 12px 10px #0007); }
.pet.color5 { filter:hue-rotate(25deg) saturate(1.25) drop-shadow(0 12px 10px #0007); }

.bubble {
  position:absolute; z-index:5; top:20px; right:8px; max-width:190px;
  padding:10px 14px; border:3px solid #3b2b73; border-radius:18px;
  background:#fff7ff; color:#2b2054; font-weight:900; line-height:1.35;
  box-shadow:5px 6px 0 #17112f; display:none; overflow:visible; white-space:normal;
}
.bubble.show { display:block; animation:pop .25s ease-out; }
.heart {
  position:absolute; left:50%; top:42%; font-size:28px; pointer-events:none;
  opacity:0; animation:none;
}
.heart.go { animation:heart 1.15s ease-out forwards; }
.zzz { position:absolute; right:18%; top:24%; font-size:30px; font-weight:1000; display:none; }
.zzz.show { display:block; animation:floatZ 1.5s infinite ease-in-out; }

.controls { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:5px; }
button {
  border:0; border-radius:17px; padding:12px 5px; color:#2d2056;
  background:linear-gradient(#fff5ff,#d9caff); font-weight:1000;
  box-shadow:0 5px 0 #24194c; cursor:pointer; touch-action:manipulation;
}
button:active { transform:translateY(4px); box-shadow:0 1px 0 #24194c; }
button .icon { display:block; font-size:23px; line-height:1; margin-bottom:4px; }
button span:last-child { font-size:12px; }
.hint { text-align:center; font-size:11px; opacity:.72; margin-top:11px; }

@keyframes bounce { from { transform:translateY(4px) scale(1); } to { transform:translateY(-8px) scale(1.03); } }
@keyframes talk { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-4px) rotate(1deg); } }
@keyframes snore { 0%,100% { transform:scale(1); } 50% { transform:scale(1.035); } }
@keyframes pop { from { transform:scale(.7); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes heart { 0% { transform:translate(-50%,0) scale(.6); opacity:0; } 20% { opacity:1; } 100% { transform:translate(-50%,-130px) scale(1.35); opacity:0; } }
@keyframes floatZ { 0%,100% { transform:translateY(3px) rotate(-4deg); } 50% { transform:translateY(-9px) rotate(4deg); } }

@media (max-height:700px) {
  .screen { min-height:500px; } .stage { height:275px; }
}
</style>
</head>
<body>
<main class="shell">
  <section class="screen">
    <div class="header">
      <div class="title">🐾 阿頭</div>
      <div class="owner">主人：安安</div>
    </div>

    <div class="status">
      <div class="meter"><b>🍖 飽食度</b><div class="bar"><div id="foodBar" class="fill"></div></div></div>
      <div class="meter"><b>💗 親密度</b><div class="bar"><div id="happyBar" class="fill"></div></div></div>
      <div class="meter"><b>🌙 精神力</b><div class="bar"><div id="energyBar" class="fill"></div></div></div>
    </div>

    <div class="stage">
      <img id="pet" class="pet" src="assets/cynthia-eb4a46790c90.webp" alt="阿頭">
      <div id="bubble" class="bubble"></div>
      <div id="zzz" class="zzz">Z z z…</div>
      <div id="foodBowl" class="food-bowl">🍚</div>
      <div id="heart" class="heart">💗</div>
    </div>

    <div class="controls">
      <button id="eatBtn"><span class="icon">🍚</span><span>吃飯</span></button>
      <button id="talkBtn"><span class="icon">💬</span><span>說話</span></button>
      <button id="sleepBtn"><span class="icon">🌙</span><span>睡覺</span></button>
      <button id="colorBtn"><span class="icon">🎨</span><span>換顏色</span></button>
    </div>
    <div class="hint">阿頭很愛撒嬌、很吵、而且超愛吃！</div>
  </section>
</main>

<script>
const normal = "assets/cynthia-eb4a46790c90.webp";
const eatImg = "assets/cynthia-0e8b100ed1d7.webp";
const sleepImg = "assets/cynthia-37baa9c6b42e.webp";

const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heart = document.getElementById('heart');
const zzz = document.getElementById('zzz');
const foodBowl = document.getElementById('foodBowl');
const foodBar = document.getElementById('foodBar');
const happyBar = document.getElementById('happyBar');
const energyBar = document.getElementById('energyBar');

let colorIndex = 0;
let food = 76, happy = 88, energy = 70;
let timer;
let hungry = false;
let feedTimer;
let sleepTimer;

function resetFeedTimer() {
  clearTimeout(feedTimer);
  feedTimer = setTimeout(() => {
    hungry = true;
    food = Math.max(0, food - 25);
    updateBars();
    foodBowl.classList.add('show');
    showBubble('安安～我肚子餓了！🍚', 2600);
  }, 10000);
}

function resetSleepTimer() {
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(() => {
    hungry = true;
    food = Math.max(0, food - 15);
    updateBars();
    foodBowl.classList.add('show');
    showBubble('安安～我又肚子餓了！🍚', 2600);
  }, 60000);
}

function showBubble(text, ms=1800) {
  bubble.textContent = text;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(()=>bubble.classList.remove('show'), ms);
}

function setMode(mode) {
  pet.className = 'pet';
  zzz.classList.remove('show');
  if (mode === 'eat') {
    pet.src = eatImg; pet.classList.add('eat');
  } else if (mode === 'sleep') {
    pet.src = sleepImg; pet.classList.add('sleep'); zzz.classList.add('show');
  } else {
    pet.src = normal;
    if (mode === 'talk') pet.classList.add('talk');
  }
}

function updateBars() {
  foodBar.style.width = food + '%';
  happyBar.style.width = happy + '%';
  energyBar.style.width = energy + '%';
}

document.getElementById('eatBtn').onclick = () => {
  setMode('eat');
  food = Math.min(100, food + 14);
  happy = Math.min(100, happy + 4);
  energy = Math.max(0, energy - 2);
  updateBars();
  showBubble('好吃！！安安再給我一點～🍖', 2200);
  heart.classList.remove('go'); void heart.offsetWidth; heart.classList.add('go');
  setTimeout(()=>setMode('normal'), 2300);
};

const replies = [
  '安安～我最喜歡你了！💗',
  '喵！我今天也超有精神！',
  '安安，你有沒有帶好吃的？',
  '嘿嘿～摸摸我嘛！',
  '我叫阿頭！喵嗚～～'
];
document.getElementById('talkBtn').onclick = () => {
  setMode('talk');
  happy = Math.min(100, happy + 5);
  energy = Math.max(0, energy - 1);
  updateBars();
  showBubble(replies[Math.floor(Math.random()*replies.length)], 2300);
  heart.classList.remove('go'); void heart.offsetWidth; heart.classList.add('go');
  setTimeout(()=>setMode('normal'), 2400);
};

let sleeping = false;
document.getElementById('sleepBtn').onclick = () => {
  sleeping = !sleeping;
  if (sleeping) {
    setMode('sleep');
    showBubble('呼……呼……Zzz……😴', 999999);
    energy = Math.min(100, energy + 2);
  } else {
    setMode('normal');
    bubble.classList.remove('show');
    showBubble('睡飽了！安安早安～☀️', 1800);
  }
  updateBars();
};

document.getElementById('colorBtn').onclick = () => {
  sleeping = false;
  setMode('normal');
  bubble.classList.remove('show');
  colorIndex = (colorIndex + 1) % 6;
  pet.classList.remove('color1','color2','color3','color4','color5');
  if (colorIndex > 0) pet.classList.add('color' + colorIndex);
  const names = ['灰色原色','粉紅色','藍色','綠色','紫色','黃色'];
  showBubble('變成' + names[colorIndex] + '啦！✨', 1700);
};

updateBars();
resetFeedTimer();
resetSleepTimer();
showBubble('安安～歡迎回來！\n陪阿頭玩吧！💗', 2200);
</script>
<script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/cynthia-eb4a46790c90.webp", "assets/cynthia-0e8b100ed1d7.webp", "assets/cynthia-37baa9c6b42e.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body>
</html>
