<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>麥當勞° × Eden｜像素電子小寵物</title>
<style>
:root{color-scheme:dark;--navy:#071b58;--blue:#123a9a;--cyan:#65dcff;--yellow:#ffe45c;--pink:#ff83c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1b69d8 0,#102c82 45%,#07123c 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;display:flex;justify-content:center;padding:18px 14px calc(22px + env(safe-area-inset-bottom))}
.app{width:min(100%,520px)}.top{text-align:center;margin:4px 0 14px}.kicker{font-size:12px;letter-spacing:3px;color:#9cecff}.top h1{font-size:clamp(25px,7vw,36px);line-height:1.2;margin:5px 0;color:var(--yellow);text-shadow:3px 3px 0 #09215e,-1px -1px 0 #09215e}.top p{margin:5px 0;color:#d9eaff;font-size:14px}
.screen{position:relative;border:4px solid #6ce6ff;border-radius:18px;padding:10px;background:#07174a;box-shadow:0 0 0 4px #0b2d7e,0 12px 0 #040d32,0 18px 35px #02082180;overflow:hidden}.screen:before{content:"PET DISPLAY";display:block;text-align:left;font-size:11px;letter-spacing:2px;color:#7eeaff;padding:2px 4px 8px}.petframe{position:relative;overflow:hidden;border:2px solid #315dc4;border-radius:10px;background:#061e68;min-height:240px;display:flex;align-items:center;justify-content:center}.petimg{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain;image-rendering:pixelated;transition:filter .2s,transform .2s}.petframe.happy .petimg{animation:bounce .55s ease-in-out 2}.petframe.eating .petimg{animation:chew .25s ease-in-out 5}.petframe.sleeping .petimg{filter:brightness(.72) saturate(.75);transform:translateY(9px) scale(.97)}.petframe.talking .petimg{animation:bob .35s ease-in-out 3}
@keyframes bounce{50%{transform:translateY(-12px) scale(1.025)}}@keyframes chew{50%{transform:scaleX(.97) scaleY(1.02)}}@keyframes bob{50%{transform:translateY(-5px)}}
.float{position:absolute;top:12px;right:14px;font-size:clamp(26px,7vw,40px);filter:drop-shadow(2px 2px #071b58);animation:floaty 1s ease-in-out infinite alternate;pointer-events:none}@keyframes floaty{to{transform:translateY(-7px) rotate(7deg)}}.speech{position:absolute;left:12px;right:12px;bottom:12px;margin:auto;width:max-content;max-width:calc(100% - 24px);background:#fff;color:#10245b;border:3px solid #09215e;border-radius:12px;padding:8px 13px;font-weight:800;text-align:center;box-shadow:3px 3px 0 #071b58;font-size:15px}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 4px 4px;font-size:13px;color:#d7e8ff}.status strong{color:var(--yellow)}.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.action{min-height:76px;border:3px solid #fff;border-radius:15px;background:linear-gradient(#3d83ff,#1750cb);color:#fff;font:800 18px/1.25 inherit;font-size:18px;font-weight:850;box-shadow:0 6px 0 #06164f;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.action .emoji{font-size:29px}.action:active{transform:translateY(4px);box-shadow:0 2px 0 #06164f}.action.sleep{background:linear-gradient(#a27aff,#6544c7)}.action.feed{background:linear-gradient(#ffb84c,#df6a18)}.action.talk{background:linear-gradient(#ff83c8,#d7448f)}.hint{text-align:center;color:#b9d9ff;font-size:12px;line-height:1.6;margin:18px 4px 0}.reset{display:block;margin:14px auto 0;border:1px solid #8ab8ff;background:#0b2468;color:#dcecff;border-radius:999px;padding:10px 18px;font-size:14px}
@media(min-width:440px){.petframe{min-height:300px}.action{min-height:84px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="app">
<header class="top"><div class="kicker">PIXEL PET • POCKET COMPANION</div><h1>麥當勞°</h1><p>Eden 的開心小烏賊｜三角形電子寵物</p></header>
<section class="screen" aria-label="寵物互動畫面"><div class="petframe" id="petframe"><img class="petimg" alt="麥當勞°，白色三角形烏賊像素寵物" src="assets/eden-721b4bb99fcb.webp"><div class="float" id="float" aria-hidden="true">✨</div><div class="speech" id="speech" aria-live="polite">Eden！今天也一起玩吧！♥</div></div><div class="status"><span>心情：<strong id="mood">超開心</strong></span><span>主人：<strong>Eden</strong></span></div></section>
<section class="buttons" aria-label="寵物操作按鈕"><button class="action" data-action="pet"><span class="emoji">🖐️</span><span>摸摸頭</span></button><button class="action feed" data-action="feed"><span class="emoji">🍘</span><span>餵食</span></button><button class="action talk" data-action="talk"><span class="emoji">💬</span><span>說話</span></button><button class="action sleep" data-action="sleep"><span class="emoji">🌙</span><span>睡覺</span></button></section>
<p class="hint">點選大按鈕和麥當勞°互動！<br>這是單一 HTML 檔，圖片已內嵌，存好後不用連網也能玩。</p><button class="reset" id="reset">↻ 叫醒／回到待機</button>
</main><script>
const frame=document.getElementById('petframe'), speech=document.getElementById('speech'), mood=document.getElementById('mood'), floater=document.getElementById('float');
const states={pet:{cls:'happy',icon:'💖✨',line:'呼嚕呼嚕～Eden 摸摸好舒服！',mood:'幸福到冒泡'},feed:{cls:'eating',icon:'🍘✨',line:'嚼嚼嚼！飼料好好吃，謝謝 Eden！',mood:'吃得好滿足'},talk:{cls:'talking',icon:'💬♥',line:'Eden！你今天也超棒的！我們一起玩吧！',mood:'興奮聊天'},sleep:{cls:'sleeping',icon:'💤🌙',line:'呼……呼……Zzz……晚安，Eden。',mood:'睡得香香'}};
function act(name){const s=states[name];frame.className='petframe '+s.cls;speech.textContent=s.line;mood.textContent=s.mood;floater.textContent=s.icon;}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
document.getElementById('reset').addEventListener('click',()=>{frame.className='petframe';speech.textContent='Eden！今天也一起玩吧！♥';mood.textContent='超開心';floater.textContent='✨'});
</script><script data-portfolio-preload>
window.addEventListener('load', () => {
  const preload = () => ["assets/eden-721b4bb99fcb.webp"].forEach(src => {
    const image = new Image();
    image.src = src;
  });
  if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1500 });
  else setTimeout(preload, 500);
});
</script>
</body></html>
