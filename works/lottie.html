<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>笙笙｜完成版房間電子雞</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#f5c85b;--gold2:#ffe7a4;--ink:#160d1d;--panel:#3a2744;--panel2:#543463;
  --muted:#d4bedb;--sat:#ff9e63;--energy:#7bd29b;--sleep:#7ebaf5;
}
html,body{margin:0;min-height:100%;background:#130d18}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#fff;display:flex;justify-content:center;background:radial-gradient(circle at 50% 0,#382448 0,#1a1122 52%,#100a14 100%)}
.app{width:min(100vw,780px);padding:14px 14px 26px}
.header{background:linear-gradient(180deg,#51345b,#322039);border:4px solid var(--gold);border-radius:18px;padding:11px 14px;box-shadow:0 7px 0 var(--ink);text-align:center}
.header h1{margin:0;color:var(--gold2);font-size:24px;letter-spacing:2px}.header p{margin:5px 0 0;color:#f0c8fb;font-size:12px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:13px 0 10px}
.meter{background:linear-gradient(180deg,#3b2946,#2c1d35);border:2px solid #805990;border-radius:13px;padding:8px 9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.meter-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;font-weight:900;margin-bottom:6px;white-space:nowrap}.meter-head strong{font-size:13px}
.track{height:10px;border-radius:999px;background:#1a1220;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.fill{height:100%;width:100%;border-radius:inherit;transition:width .35s ease}.fill.sat{background:linear-gradient(90deg,#ff805d,var(--sat))}.fill.energy{background:linear-gradient(90deg,#55ba7e,var(--energy))}.fill.sleep{background:linear-gradient(90deg,#5a9ee6,var(--sleep))}
.stage-shell{border:5px solid var(--gold);border-radius:21px;padding:8px;background:linear-gradient(180deg,#573b62,#34223e);box-shadow:0 8px 0 var(--ink)}
.stage{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3;border-radius:15px;background-image:url('assets/lottie-2fa524d1ae6c.webp');background-position:center;background-size:cover;background-repeat:no-repeat;isolation:isolate;touch-action:manipulation}
.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,249,231,.015),rgba(0,0,0,.02) 65%,rgba(0,0,0,.09));pointer-events:none;z-index:2}
.location-tag{position:absolute;z-index:3;font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:rgba(45,28,48,.76);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(2px);pointer-events:none}.tag-bed{left:4%;bottom:7%}.tag-table{left:47%;bottom:8%}.tag-bath{right:1.5%;bottom:8%}.tag-tv{left:49%;top:4%}
.pet{position:absolute;left:44%;top:73%;width:118px;height:177px;transform:translate(-50%,-66%);transition:left .92s cubic-bezier(.2,.8,.2,1),top .92s cubic-bezier(.2,.8,.2,1),transform .2s ease;z-index:10;cursor:pointer;user-select:none;filter:drop-shadow(0 5px 2px rgba(27,13,22,.18))}
.pet.flip{transform:translate(-50%,-66%) scaleX(-1)}.pet.flip .bubble,.pet.flip .status-fx{transform:translateX(-50%) scaleX(-1)}
.pet.fainted{filter:grayscale(.18) drop-shadow(0 5px 2px rgba(27,13,22,.18));animation:faintPulse 1.1s ease-in-out infinite alternate}
.shadow{position:absolute;left:50%;bottom:8px;width:78px;height:17px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.22);filter:blur(1px);z-index:0}
.sprite{position:absolute;inset:0;background-image:url('assets/lottie-1d97064a0d36.webp');background-repeat:no-repeat;background-size:400% 200%;background-position:0 0;image-rendering:auto;z-index:1}
.bubble{position:absolute;left:50%;top:-44px;transform:translateX(-50%);min-width:142px;max-width:205px;padding:8px 10px;border:3px solid #382039;border-radius:14px;background:#fff;color:#35172e;font-size:12px;font-weight:900;line-height:1.3;text-align:center;box-shadow:3px 3px 0 #382039;display:none;z-index:6}.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:#fff;border-right:3px solid #382039;border-bottom:3px solid #382039;transform:translateX(-50%) rotate(45deg)}
.status-fx{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:30px;font-weight:1000;color:#dff3ff;text-shadow:2px 2px 0 #33203c;display:none;z-index:5}
.flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(255,255,255,.82);opacity:0}.flash.pop{animation:flash .45s ease-out}
.tv-screen{position:absolute;left:49.2%;top:7.2%;width:10.2%;height:7.2%;z-index:5;border:3px solid rgba(35,18,30,.8);border-radius:7px;background:linear-gradient(180deg,#101016,#1a1c25);box-shadow:0 0 0 2px rgba(255,243,190,.14),0 8px 14px rgba(0,0,0,.26);overflow:hidden}.tv-screen::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 2px,transparent 2px 4px);opacity:.16;pointer-events:none}.tv-screen.on{box-shadow:0 0 0 2px rgba(255,233,165,.22),0 0 18px rgba(255,223,128,.18),0 8px 14px rgba(0,0,0,.26)}
.tv-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:5px;color:#fff;font-size:10px;font-weight:900;overflow:hidden}.tv-screen.off .tv-content{color:#cfd8e8;font-size:16px}.tv-label{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:999px;background:rgba(0,0,0,.55);padding:1px 5px;font-size:8px;color:#fff6d9}.marquee{display:inline-block;white-space:nowrap;animation:marquee 4.8s linear infinite}.tv-screen.channel-forest .tv-content{background:linear-gradient(180deg,#47b07e,#215b53)}.tv-screen.channel-music .tv-content{background:linear-gradient(135deg,#9d63ff,#ff7eae 55%,#ffc85a)}.tv-screen.channel-food .tv-content{background:linear-gradient(180deg,#ffb36a,#f07b52)}
.hint{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);z-index:6;background:rgba(27,17,31,.78);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 9px;font-size:10px;color:#fff4cd;pointer-events:none;opacity:.9}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:13px}
button{min-height:78px;border:4px solid var(--gold);background:linear-gradient(180deg,#69407c,#472b56);color:#fff;border-radius:15px;box-shadow:0 6px 0 var(--ink);font-size:18px;font-weight:1000;cursor:pointer;touch-action:manipulation;padding:8px 6px}button small{display:block;margin-top:3px;color:#f2d8fa;font-size:10px;font-weight:800;line-height:1.25}button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}button:disabled{opacity:.48;cursor:not-allowed;filter:grayscale(.25)}
.info-row{display:grid;grid-template-columns:1.15fr .85fr;gap:9px;margin-top:12px}.toast,.clock{background:#2b1d34;border:2px solid #725080;border-radius:12px;min-height:42px;padding:8px 10px;display:flex;align-items:center;font-size:12px}.toast{justify-content:center;text-align:center;color:#ffe083;font-weight:900}.clock{justify-content:space-between;color:#dac7e1}.clock strong{color:#fff4cf}
.auto-note{margin-top:8px;text-align:center;color:var(--muted);font-size:10px;line-height:1.55}.revive-note{color:#ffcfdf;font-weight:900}
@keyframes flash{0%{opacity:0}22%{opacity:1}100%{opacity:0}}@keyframes faintPulse{from{transform:translate(-50%,-66%) rotate(-2deg)}to{transform:translate(-50%,-66%) rotate(2deg)}}@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-115%)}}
@media(max-width:620px){.app{padding:10px 10px 20px}.header h1{font-size:21px}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.pet{width:96px;height:144px}.bubble{top:-40px;min-width:128px;font-size:11px}.info-row{grid-template-columns:1fr}.stage-shell{padding:6px}.meter{padding:7px}.meter-head{font-size:11px}.meter-head strong{font-size:12px}}
@media(max-width:360px){.meters{gap:5px}.meter-head span{font-size:10px}.pet{width:88px;height:132px}button{min-height:72px;font-size:17px}}
@media(prefers-reduced-motion:reduce){.pet,.fill{transition:none}.pet.fainted{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>笙笙 · 完成版房間電子雞</h1>
    <p>會自己走、會餓、會睏、會搗蛋，也會真的昏倒</p>
  </header>

  <section class="meters" aria-label="笙笙狀態">
    <div class="meter"><div class="meter-head"><span>🍚 飽食度</span><strong id="satText">100</strong></div><div class="track"><div class="fill sat" id="satBar"></div></div></div>
    <div class="meter"><div class="meter-head"><span>⚡ 體力</span><strong id="energyText">100</strong></div><div class="track"><div class="fill energy" id="energyBar"></div></div></div>
    <div class="meter"><div class="meter-head"><span>💤 睡眠度</span><strong id="sleepText">100</strong></div><div class="track"><div class="fill sleep" id="sleepBar"></div></div></div>
  </section>

  <div class="stage-shell">
    <main class="stage" id="stage" aria-label="笙笙的房間">
      <div class="location-tag tag-bed">🛋️ 休息區</div>
      <div class="location-tag tag-table">🍊 吃飯區</div>
      <div class="location-tag tag-bath">🚽 獨立浴室</div>
      <div class="location-tag tag-tv">📺 閣樓電視區</div>
      <div class="tv-screen off" id="tvScreen" aria-hidden="true"><div class="tv-content" id="tvContent">📺</div><div class="tv-label" id="tvLabel">待機中</div></div>
      <div class="pet" id="pet" role="button" tabindex="0" aria-label="笙笙，點一下可以互動">
        <div class="bubble" id="bubble"></div>
        <div class="status-fx" id="fx">Zzz</div>
        <div class="shadow"></div>
        <div class="sprite" id="sprite"></div>
      </div>
      <div class="hint" id="hint">點笙笙也可以陪牠玩</div>
      <div class="flash" id="flash"></div>
    </main>
  </div>

  <section class="controls" aria-label="操作按鈕">
    <button type="button" data-act="eat">🍚 吃飯<small>飽食 +35｜體力 +5</small></button>
    <button type="button" data-act="sleep">💤 睡覺<small>睡眠 +45｜體力 +30</small></button>
    <button type="button" data-act="toilet">🚽 上廁所<small>走進右側獨立浴室</small></button>
    <button type="button" data-act="prank">💣 惡作劇<small>消耗體力，壞心一下</small></button>
    <button type="button" data-act="tv">📺 看電視<small>上樓隨機播放 3 種影片</small></button>
  </section>

  <div class="info-row">
    <div class="toast" id="toast" aria-live="polite">笙笙正在房間裡到處晃。</div>
    <div class="clock"><span>⏱️ 25 秒循環</span><strong id="cycleText">下一次：25 秒</strong></div>
  </div>
  <div class="auto-note" id="autoNote">每 25 秒會消耗狀態；25 秒沒餵食會喊餓；25 秒沒互動會自己去睡；50 秒沒互動會開始搗蛋。新增閣樓電視功能：按下按鈕可上樓看電視，並會從 3 種影片中隨機播放；笙笙也有可能自己隨機走上樓看。<span class="revive-note">體力歸零時會昏倒，點笙笙即可叫醒。</span></div>
</div>
<script>
(() => {
  const root = document.querySelector('.app');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  const pet = document.getElementById('pet');
  const sprite = document.getElementById('sprite');
  const bubble = document.getElementById('bubble');
  const fx = document.getElementById('fx');
  const toast = document.getElementById('toast');
  const satBar = document.getElementById('satBar');
  const energyBar = document.getElementById('energyBar');
  const sleepBar = document.getElementById('sleepBar');
  const satText = document.getElementById('satText');
  const energyText = document.getElementById('energyText');
  const sleepText = document.getElementById('sleepText');
  const cycleText = document.getElementById('cycleText');
  const flash = document.getElementById('flash');
  const tvScreen = document.getElementById('tvScreen');
  const tvContent = document.getElementById('tvContent');
  const tvLabel = document.getElementById('tvLabel');
  const buttons = [...document.querySelectorAll('[data-act]')];

  const CYCLE = 25;
  const TV_CHANNELS = [
    { key:'forest', title:'森林探險台', line:'🌳🦋🌿 小動物冒險中' },
    { key:'music', title:'爆笑音樂台', line:'🎵✨🎤 歌曲與舞蹈秀' },
    { key:'food', title:'美食料理台', line:'🍳🍜🍮 今日特餐開煮' }
  ];
  const POSES = {
    idle:[0,0], walk:[1,0], run:[2,0], eat:[3,0],
    sleep:[0,1], toilet:[1,1], angry:[2,1], prank:[3,1]
  };

  let stats = { satiety:100, energy:100, sleep:100 };
  let currentX = 44, currentY = 73;
  let mode = 'idle';
  let runId = 0;
  let lastFed = Date.now();
  let lastInteract = Date.now();
  let lastCycle = Date.now();
  let hungryWarned = false;
  let autoSleepTriggered = false;
  let autoPrankTriggered = false;
  let bubbleTimer = null;
  let fainted = false;

  const clamp = n => Math.max(0, Math.min(100, Math.round(n)));
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function setPose(name){
    const p = POSES[name] || POSES.idle;
    sprite.style.backgroundPosition = `${p[0] * 33.3333333333}% ${p[1] * 100}%`;
  }
  function say(text, ms=1700){
    bubble.textContent = text;
    bubble.style.display = 'block';
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.style.display = 'none', ms);
  }
  function setToast(text){ toast.textContent = text; }
  function pickChannel(){ return TV_CHANNELS[Math.floor(Math.random()*TV_CHANNELS.length)]; }
  function stopTV(){
    tvScreen.className = 'tv-screen off';
    tvContent.innerHTML = '📺';
    tvLabel.textContent = '待機中';
  }
  function playTV(channel){
    tvScreen.className = 'tv-screen on channel-' + channel.key;
    tvContent.innerHTML = `<span class="marquee">${channel.line}</span>`;
    tvLabel.textContent = channel.title;
  }
  function setFx(text=''){
    fx.textContent = text;
    fx.style.display = text ? 'block' : 'none';
  }
  function renderStats(){
    stats.satiety = clamp(stats.satiety); stats.energy = clamp(stats.energy); stats.sleep = clamp(stats.sleep);
    satBar.style.width = stats.satiety + '%'; energyBar.style.width = stats.energy + '%'; sleepBar.style.width = stats.sleep + '%';
    satText.textContent = stats.satiety; energyText.textContent = stats.energy; sleepText.textContent = stats.sleep;
    if (stats.energy <= 0 && !fainted) faint();
  }
  function changeStats(ds=0,de=0,dsl=0){
    stats.satiety += ds; stats.energy += de; stats.sleep += dsl; renderStats();
  }
  function faceToward(x){
    if (x < currentX - 1) pet.classList.add('flip');
    else if (x > currentX + 1) pet.classList.remove('flip');
  }
  async function moveTo(x,y,pose='walk',id=runId){
    if (id !== runId || fainted) return false;
    faceToward(x); currentX=x; currentY=y; setPose(pose);
    pet.style.left=x+'%'; pet.style.top=y+'%';
    await wait(940);
    return id === runId && !fainted;
  }
  function resetInteraction(){
    lastInteract = Date.now(); autoSleepTriggered=false; autoPrankTriggered=false;
  }
  function resumeIdle(text='笙笙又開始在房間裡亂晃。'){
    if (fainted) return;
    mode='idle'; setFx(''); setPose('idle'); setToast(text);
  }
  function setButtonsDisabled(disabled){ buttons.forEach(b => b.disabled = disabled); }

  function faint(){
    fainted = true; mode='fainted'; ++runId;
    setButtonsDisabled(true); stopTV(); setPose('sleep'); setFx('💫'); pet.classList.add('fainted');
    setToast('笙笙體力歸零，昏倒了！點笙笙把牠叫醒。');
    say('……沒力了……',2500);
  }
  function revive(){
    if (!fainted) return;
    fainted=false; pet.classList.remove('fainted'); setButtonsDisabled(false); setFx('');
    stats.energy=25; stats.sleep=Math.max(stats.sleep,25); renderStats();
    resetInteraction(); mode='idle'; setPose('idle');
    setToast('笙笙被你叫醒了，先恢復一點體力。'); say('我醒了……先不要叫我跑！',1800);
  }

  async function act(kind, auto=false){
    if (fainted) return;
    if (!auto) resetInteraction();
    const id = ++runId; mode=kind; setFx('');
    if (kind !== 'tv') stopTV();

    if (kind === 'eat'){
      lastFed=Date.now(); hungryWarned=false;
      setToast('笙笙抱著食物跑去矮桌旁。'); say('我的！全部都是我的！');
      if (!await moveTo(52,78,'run',id)) return;
      setPose('eat'); setToast('笙笙正在大口吃飯。');
      changeStats(35,5,0); await wait(2600); if (id!==runId || fainted) return;
      resumeIdle('笙笙吃飽了，又開始到處晃。'); return;
    }

    if (kind === 'sleep'){
      setToast('笙笙慢吞吞走去左邊休息區。'); say('不要吵我，我要睡。');
      if (!await moveTo(17,73,'walk',id)) return;
      setPose('sleep'); setFx('Zzz'); setToast('笙笙睡著了……');
      await wait(4000); if (id!==runId || fainted) return;
      changeStats(0,30,45); resumeIdle('笙笙睡飽了，精神好多了。'); return;
    }

    if (kind === 'toilet'){
      setToast('笙笙拿著衛生紙衝去右邊獨立浴室。'); say('讓開，很急！！');
      if (!await moveTo(92,72,'run',id)) return;
      setPose('toilet'); setToast('笙笙在獨立浴室裡上廁所。'); say('不准偷看！');
      await wait(3000); if (id!==runId || fainted) return;
      changeStats(-3,-2,0); await moveTo(72,76,'walk',id); if (id!==runId || fainted) return;
      resumeIdle('笙笙若無其事地從浴室走回來。'); return;
    }

    if (kind === 'prank'){
      if (stats.energy < 12){ say('我沒力氣搗蛋啦……'); setToast('笙笙體力不足，先睡覺比較好。'); return; }
      stopTV();
      setToast('笙笙露出壞心表情，開始找炸彈。'); say('嘿嘿……計畫開始♥');
      if (!await moveTo(70,76,'walk',id)) return;
      setPose('prank'); changeStats(0,-12,-5); await wait(1900); if (id!==runId || fainted) return;
      flash.classList.remove('pop'); void flash.offsetWidth; flash.classList.add('pop');
      setPose('angry'); setToast('💥 笙笙成功惡作劇一次！'); say('哼哼，成功！');
      await wait(1300); if (id!==runId || fainted) return;
      resumeIdle(); return;
    }

    if (kind === 'tv'){
      const channel = pickChannel();
      setToast('笙笙沿著樓梯跑上閣樓，準備看電視。');
      say('我要上樓看電視！');
      if (!await moveTo(79,71,'walk',id)) return;
      if (!await moveTo(73,48,'walk',id)) return;
      if (!await moveTo(56,24,'walk',id)) return;
      setPose('idle');
      playTV(channel);
      setToast('📺 ' + channel.title + ' 隨機播放中……');
      say('今天看這個！');
      changeStats(-2,6,-3);
      await wait(5200); if (id!==runId || fainted) return;
      setToast('笙笙看完電視，慢慢走下樓。');
      stopTV();
      if (!await moveTo(69,30,'walk',id)) return;
      if (!await moveTo(73,48,'walk',id)) return;
      if (!await moveTo(66,75,'walk',id)) return;
      resumeIdle('笙笙看完電視了，又回到房間裡晃。');
      return;
    }
  }

  function wander(){
    if (mode !== 'idle' || fainted) return;
    const sinceInteract = (Date.now() - lastInteract) / 1000;
    if (sinceInteract > 8 && sinceInteract < 22 && Math.random() < 0.16 && stats.energy > 10){
      act('tv', true);
      return;
    }
    const id = runId;
    const x = 24 + Math.random()*51;
    const y = 71 + Math.random()*8;
    faceToward(x); currentX=x; currentY=y;
    setPose(Math.random()>.35 ? 'walk' : 'idle');
    pet.style.left=x+'%'; pet.style.top=y+'%';
    setTimeout(() => { if (id===runId && mode==='idle' && !fainted) setPose('idle'); },950);
  }

  function petInteraction(){
    if (fainted){ revive(); return; }
    resetInteraction();
    const messages=['芊芊～陪我玩！','摸哪裡啦！','哼，我才沒有很開心。','再摸一下也不是不行。'];
    say(messages[Math.floor(Math.random()*messages.length)],1500);
    setPose(Math.random()>.5?'idle':'angry');
    changeStats(0,4,1);
    setToast('你陪笙笙玩了一下，牠的體力稍微恢復。');
    setTimeout(() => { if (mode==='idle' && !fainted) setPose('idle'); },1000);
  }

  buttons.forEach(btn => btn.addEventListener('click', () => act(btn.dataset.act,false)));
  pet.addEventListener('click', petInteraction);
  pet.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); petInteraction(); } });

  setInterval(wander,3800);
  setInterval(() => {
    const now = Date.now();
    const cycleElapsed = Math.floor((now-lastCycle)/1000);
    const remain = Math.max(0,CYCLE-cycleElapsed);
    cycleText.textContent = '下一次：' + remain + ' 秒';

    if (cycleElapsed >= CYCLE){
      lastCycle = now;
      if (!fainted){
        changeStats(-12,-6,-8);
        if (stats.satiety <= 25) say('我真的很餓！！快餵我！',2100);
        else if (stats.sleep <= 20) say('我好睏……',1800);
      }
    }

    const sinceFed = Math.floor((now-lastFed)/1000);
    const sinceInteract = Math.floor((now-lastInteract)/1000);
    if (!fainted && sinceFed >= CYCLE && !hungryWarned){
      hungryWarned=true; say('芊芊！我肚子餓了！！',2200); setToast('笙笙開始催你餵飯。');
    }
    if (!fainted && sinceInteract >= CYCLE && !autoSleepTriggered){
      autoSleepTriggered=true; act('sleep',true);
    }
    if (!fainted && sinceInteract >= CYCLE*2 && !autoPrankTriggered){
      autoPrankTriggered=true; act('prank',true);
    }
  },250);

  stopTV();
  setPose('idle'); renderStats();
  pet.style.left=currentX+'%'; pet.style.top=currentY+'%';
  setTimeout(wander,800);
})();
</script>
