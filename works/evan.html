<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17172b">
<title>肥仔｜電子雞小寵物</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 10%, #3a3970 0, #1c1c38 38%, #0d0d19 100%);
    color: #fff;
    font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px;
  }
  .game {
    width: min(560px, 100%);
    min-height: min(820px, calc(100vh - 28px));
    border: 4px solid #49b7ff;
    border-radius: 22px;
    background: linear-gradient(180deg, #202044, #111126);
    box-shadow: 0 0 0 4px #11152b, 0 18px 50px rgba(0,0,0,.45);
    padding: 18px;
    display: flex;
    flex-direction: column;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(28px, 7vw, 42px);
    letter-spacing: 3px;
    color: #ffe45c;
    text-shadow: 3px 3px #111;
  }
  .subtitle {
    text-align: center;
    margin: 4px 0 8px;
    color: #bfe9ff;
    font-size: 14px;
  }
  .screen {
    flex: 1;
    min-height: 390px;
    border: 3px solid #5960a7;
    border-radius: 18px;
    margin: 8px 0 16px;
    background:
      radial-gradient(circle at 50% 35%, #57528c 0, #302e5b 35%, #17172e 78%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen::before {
    content: "★  ★  ★";
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: #ffe45c;
    opacity: .55;
    font-size: 18px;
  }
  #pet {
    width: min(76%, 330px);
    max-height: 340px;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(0 12px 8px rgba(0,0,0,.3));
    user-select: none;
    -webkit-user-drag: none;
    transition: transform .12s ease;
  }
  #status {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    background: rgba(10,10,25,.82);
    border: 2px solid #49b7ff;
    border-radius: 999px;
    padding: 7px 16px;
    font-weight: 800;
    white-space: nowrap;
    font-size: 14px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  button {
    min-height: 76px;
    border: 3px solid #65c7ff;
    border-radius: 16px;
    background: linear-gradient(#30306b, #1b1b43);
    color: white;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #0b0b20;
    touch-action: manipulation;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #0b0b20;
    background: #3d3d82;
  }
  .small {
    display: block;
    font-size: 12px;
    color: #bfe9ff;
    margin-top: 2px;
    font-weight: 600;
  }
  .hint {
    text-align: center;
    color: #9292b9;
    font-size: 12px;
    margin-top: 13px;
  }
</style>
</head>
<body>
<main class="game">
  <h1>肥仔 🐸</h1>

const pet = document.getElementById("pet");
const statusEl = document.getElementById("status");
let timer = null;
let colorIndex = 0;

const messages = {
  feed: "肥仔正在開心吃飼料 🍚",
  play: "肥仔跑來跑去！⚽",
  bath: "肥仔洗香香，亮晶晶 ✨",
  color: "肥仔變成新顏色啦 🌈"
};

function doAction(action) {
  if (timer) clearInterval(timer);

  if (action === "color") {
    colorIndex = (colorIndex + 1) % sprites.color.length;
    pet.src = sprites.color[colorIndex];
    statusEl.textContent = messages.color;
    bounce();
    return;
  }

  const frames = sprites[action];
  let i = 0;
  pet.src = frames[0];
  statusEl.textContent = messages[action];
  bounce();

  timer = setInterval(() => {
    i++;
    if (i >= frames.length) {
      clearInterval(timer);
      timer = null;
      pet.src = frames[frames.length - 1];
      setTimeout(() => {
        statusEl.textContent = "肥仔現在心情很好 😎";
      }, 900);
      return;
    }
    pet.src = frames[i];
    bounce();
  }, action === "play" ? 260 : 420);
}

function bounce() {
  pet.style.transform = "scale(1.06) translateY(-5px)";
  setTimeout(() => pet.style.transform = "scale(1) translateY(0)", 130);
}
</script>
