<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大帥貓｜Jeremy 的像素小寵物</title>
<style>
  :root{
    --brown:#4b271d; --gold:#f5b94f; --cream:#fff1c8;
    --orange:#e9572f; --blue:#2398d8; --green:#55ad55;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, #ffe9a8 0 8%, transparent 9%),
      linear-gradient(#6dc6e8 0 30%, #b8dc78 30% 100%);
    font-family:system-ui,"Noto Sans TC",sans-serif;
    color:var(--brown);
  }
  .app{width:min(760px,100%); padding:14px}
  .frame{
    background:#f8d98c; border:6px solid var(--brown);
    border-radius:24px; box-shadow:0 8px 0 #2e1712;
    overflow:hidden;
  }
  header{
    padding:14px 16px; background:#6b3526; color:#fff5d6;
    border-bottom:5px solid var(--gold); text-align:center;
  }
  header h1{margin:0;font-size:clamp(28px,7vw,46px);text-shadow:3px 3px #29140f}
  header p{margin:5px 0 0;font-size:16px}
  .stage{
    min-height:430px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:12px;
    background:
      linear-gradient(rgba(255,244,195,.55),rgba(255,244,195,.55)),
      repeating-linear-gradient(0deg,#79b94d 0 18px,#6da943 18px 36px);
  }
  .status{
    width:min(600px,96%); background:#fff0c7; border:4px solid var(--brown);
    border-radius:16px; padding:9px 12px; margin-bottom:10px;
    font-weight:800; text-align:center;
  }
  .pet-wrap{
    width:min(620px,96%); min-height:290px; display:flex;
    align-items:center; justify-content:center;
  }
  #petImage{
    width:min(570px,100%); max-height:330px; object-fit:contain;
    image-rendering:auto; filter:drop-shadow(0 9px 0 rgba(65,35,20,.18));
    transition:transform .15s ease;
  }
  .pet-wrap.bump #petImage{transform:scale(1.04) translateY(-4px)}
  .message{
    min-height:42px; padding:8px 16px; border:4px solid var(--brown);
    border-radius:16px; background:#fffdf1; font-size:20px; font-weight:900;
    text-align:center; box-shadow:4px 4px 0 rgba(75,39,29,.25)
  }
  .controls{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    padding:16px; background:#6b3526;
  }
  button{
    min-height:78px; border:5px solid var(--brown); border-radius:18px;
    color:white; font-weight:1000; font-size:clamp(20px,5vw,28px);
    cursor:pointer; box-shadow:0 6px 0 #2b1711; touch-action:manipulation;
  }
  button:active{transform:translateY(5px);box-shadow:0 1px 0 #2b1711}
  .eat{background:var(--orange)} .sleep{background:var(--blue)} .interact{background:var(--green)}
  .info{padding:12px 16px;background:#fff1c8;font-size:14px;line-height:1.6}
  .timer{font-weight:900}
  .bar{height:14px;border:3px solid var(--brown);border-radius:10px;background:#fff;margin-top:6px;overflow:hidden}
  .bar > i{display:block;height:100%;width:100%;background:#63bf4e;transition:width .3s}
  @media(max-width:430px){
    .app{padding:6px}.frame{border-width:4px}.stage{min-height:400px}
    .pet-wrap{min-height:270px}.controls{gap:8px;padding:10px}
    button{min-height:76px;border-width:4px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="frame">
    <header>
      <h1>🐾 大帥貓</h1>
      <p>主人：Jeremy　｜　黃色黑斑懶萌獵豹</p>
    </header>

    <main class="stage">
      <div class="status" id="status">狀態：悠閒待機</div>
      <div class="pet-wrap" id="petWrap">
        <img id="petImage" alt="大帥貓目前動作">
      </div>
      <div class="message" id="message">大帥貓正在等你～</div>
    </main>

    <section class="controls" aria-label="寵物操作">
      <button class="eat" onclick="feed()">🍖 餵食</button>
      <button class="sleep" onclick="sleepPet()">💤 睡覺</button>
      <button class="interact" onclick="interact()">🖐️ 互動</button>
    </section>

    <section class="info">
      <div>🍖 飢餓程度：<span id="hungerText">100%</span></div>
      <div class="bar"><i id="hungerBar"></i></div>
      <div class="timer">⏱️ 距離上次餵食：<span id="timer">0</span> 秒</div>
      <div>規則：連續 30 秒沒有餵食，就會自動說「肚子餓…」，直到按下「餵食」。</div>
    </section>
  </div>
</div>

const petImage = document.getElementById("petImage");
const petWrap = document.getElementById("petWrap");
const message = document.getElementById("message");
const statusEl = document.getElementById("status");
const timerEl = document.getElementById("timer");
const hungerText = document.getElementById("hungerText");
const hungerBar = document.getElementById("hungerBar");

let secondsSinceFeed = 0;
let hungerTriggered = false;
let hunger = 100;

function show(action, text, status){
  petImage.src = images[action];
  message.textContent = text;
  statusEl.textContent = "狀態：" + status;
  petWrap.classList.remove("bump");
  void petWrap.offsetWidth;
  petWrap.classList.add("bump");
}

function feed(){
  secondsSinceFeed = 0;
  hungerTriggered = false;
  hunger = 100;
  show("eat","好好吃！🍖","正在大口吃肉");
}

function sleepPet(){
  show("sleep","呼呼……睡得好舒服 💤","趴下睡覺中");
}

function interact(){
  show("interact","嗯～～好舒服！♥","正在享受摸頭");
}

function triggerHungry(){
  hungerTriggered = true;
  hunger = 20;
  show("hungry","肚子餓……🍖","肚子餓了！請餵食");
}

function tick(){
  secondsSinceFeed++;
  timerEl.textContent = secondsSinceFeed;
  // 每秒降低飢餓感，30 秒觸發自動提醒。
  hunger = Math.max(20, 100 - Math.floor(secondsSinceFeed * (80/30)));
  hungerText.textContent = hunger + "%";
  hungerBar.style.width = hunger + "%";

  if(secondsSinceFeed >= 30 && !hungerTriggered){
    triggerHungry();
  }
}
setInterval(tick,1000);

// 初始畫面
feed();
</script>
